# LEGACY — not the production topology. Kept for reference and rollback only.
#
# This file describes a single-container, Caddy-fronted bridge-network stack.
# It is NOT what runs on the VPS: production runs the two containers described in
# `deploy/compose.production.yml` behind host Nginx. PM2 is retired and kept only
# as a manual rollback path.
#
# Why it is obsolete as a deployment path:
#   - one image serves both applications, so Stays cannot be released alone;
#   - Caddy terminates TLS on 80/443, but the VPS already uses host Nginx and
#     ufw rules for those ports — running both would fight for the sockets;
#   - images are built locally (`build: .`) rather than pulled by immutable tag;
#   - Redis is a container, while production Redis is a loopback host service.
#
# Do not deploy from this file. It has no `container_name` collision protection
# against the production containers either.
#
# Retained because `Caddyfile` references it and both document the earlier
# container layout that some runbooks still mention.

services:
  app:
    build: .
    container_name: travio-app
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    expose:
      - "5000"
    networks:
      - travio
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: travio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - travio
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: travio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - uptime-kuma
    networks:
      - travio

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: travio-uptime-kuma
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - uptimekuma:/app/data
    networks:
      - travio

networks:
  travio:
    driver: bridge

volumes:
  redisdata:
  caddydata:
  caddyconfig:
  uptimekuma:
