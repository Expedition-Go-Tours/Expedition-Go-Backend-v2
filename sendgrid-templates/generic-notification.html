<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{notificationTitle}}</title>
  <style>
    body{margin:0;padding:0;width:100%!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;background-color:#F8FAFC}
    table,td{mso-table-lspace:0pt;mso-table-rspace:0pt;border-collapse:collapse}
    img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}
    .font-main{font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F8FAFC">
    <tr><td align="center" style="padding:40px 16px">
      <table role="presentation" width="100%" style="max-width:640px;background:#fff;border:1px solid #E2E8F0;border-radius:16px" cellspacing="0" cellpadding="0" border="0">
        <tr><td style="padding:40px 40px 32px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="left"><img src="{{logoUrl}}" alt="{{brandName}}" width="180" style="display:block;max-width:180px;height:auto"></td></tr></table></td></tr>
        <tr><td style="padding:0 40px 32px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center"><h1 style="margin:0 0 12px;font-size:28px;font-weight:800;color:#001F3F;line-height:1.2" class="font-main">{{notificationTitle}}</h1></td></tr></table></td></tr>
        <tr><td style="padding:0 40px 40px">
          <table role="presentation" width="100%" style="border:1px solid #E2E8F0;border-radius:12px" cellspacing="0" cellpadding="0" border="0"><tr><td style="padding:32px">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td>
              <p style="margin:0 0 16px;font-size:16px;font-weight:700;color:#001F3F" class="font-main">Hi {{recipientName}},</p>
              <div style="margin:0;font-size:15px;color:#334155;line-height:1.6" class="font-main">{{{notificationBody}}}</div>
            </td></tr></table>
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:0 40px 40px" align="center"><span style="font-size:13px;color:#64748B" class="font-main">Questions? <a href="mailto:{{supportEmail}}" style="color:#00A669;text-decoration:none;font-weight:600">{{supportEmail}}</a></span></td></tr>
        <tr><td bgcolor="#001F3F" style="padding:32px 40px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="left" style="color:#fff;font-size:14px;line-height:1.4" class="font-main"><strong style="color:#00A669">Stay informed</strong><br><span style="color:#94A3B8;font-size:13px">{{brandName}} Team</span></td><td align="right" style="font-family:'Caveat','Georgia','Apple Chancery',cursive;font-size:20px;color:#fff;font-weight:400" valign="middle">Keeping you in the loop.</td></tr></table></td></tr>
      </table>
      <p style="margin:24px 0 0;text-align:center;font-size:11px;color:#94A3B8;line-height:1" class="font-main">&copy; {{year}} {{brandName}} by Expedition-Go Tours. All rights reserved.</p>
    </td></tr>
  </table>
</body>
</html>
