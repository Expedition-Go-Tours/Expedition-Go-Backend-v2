name: AI Debug

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MAX_ATTEMPTS: 3
      MAX_FILES: 10
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch failed logs
        run: |
          set +e
          mkdir -p .ci-results
          RUN_ID="${{ github.event.workflow_run.id }}"

          gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -500 > .ci-results/failed-logs.txt || true
          gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' \
            > .ci-results/failed-jobs.txt 2>/dev/null || true

          echo "${{ github.event.workflow_run.head_sha }}" > .ci-results/sha.txt
          echo "${{ github.event.workflow_run.head_branch }}" > .ci-results/branch.txt

          echo "=== Failed Jobs ==="
          cat .ci-results/failed-jobs.txt || echo "(none)"
          echo ""
          echo "=== Failed Logs (last 100 lines) ==="
          tail -100 .ci-results/failed-logs.txt || echo "(none)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run AI debug agent
        id: debug
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          set +e

          DEBUG_BRANCH="ai-fix/$(date +%s)"
          git checkout -b "$DEBUG_BRANCH"

          # Read files — use || true so bash -e doesn't kill us
          FAIL_LOG=""
          FAIL_JOBS=""
          TEMPLATE=""
          if [ -f .ci-results/failed-logs.txt ]; then
            FAIL_LOG=$(cat .ci-results/failed-logs.txt | head -2000)
          fi
          if [ -f .ci-results/failed-jobs.txt ]; then
            FAIL_JOBS=$(cat .ci-results/failed-jobs.txt)
          fi
          if [ -f .github/workflows/ai-debug-prompt.txt ]; then
            TEMPLATE=$(cat .github/workflows/ai-debug-prompt.txt)
          fi

          echo "FAIL_LOG length: ${#FAIL_LOG}"
          echo "FAIL_JOBS: $FAIL_JOBS"
          echo "TEMPLATE length: ${#TEMPLATE}"

          if [ -z "$TEMPLATE" ]; then
            echo "ERROR: ai-debug-prompt.txt not found or empty"
            echo "fixed=false" >> $GITHUB_OUTPUT
            echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
            echo "attempts=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          ATTEMPT=0
          FIXED=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && [ "$FIXED" = "false" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "=== AI Debug Attempt $ATTEMPT / $MAX_ATTEMPTS ==="
            echo ""

            # Try to read the relevant source files for context (limit to 10 files, 50 lines each)
            FILE_CONTEXT=""
            if [ -n "$FAIL_JOBS" ]; then
              for FILE_PATH in $(echo "$FAIL_LOG" | grep -oE '[a-zA-Z0-9_/.-]+\.(js|ts|jsx|tsx|mjs)' | sort -u | head -10); do
                if [ -f "$FILE_PATH" ]; then
                  FILE_CONTEXT+=$'\n'"--- FILE: $FILE_PATH ---"$'\n'
                  FILE_CONTEXT+=$(head -50 "$FILE_PATH")$'\n'
                  FILE_CONTEXT+=$'\n'"--- END FILE: $FILE_PATH ---"$'\n'
                fi
              done
            fi
            echo "FILE_CONTEXT length: ${#FILE_CONTEXT}"

            # Build prompt from template using jq for safe escaping
            PROMPT=$(jq -n --arg template "$TEMPLATE" --arg log "$FAIL_LOG" --arg jobs "$FAIL_JOBS" --arg files "$FILE_CONTEXT" \
              '$template | gsub("\\{\\{FAIL_LOG\\}\\}"; $log) | gsub("\\{\\{FAIL_JOBS\\}\\}"; $jobs) | gsub("\\{\\{FILE_CONTENTS\\}\\}"; $files)' 2>/dev/null)

            if [ -z "$PROMPT" ]; then
              echo "ERROR: Failed to build prompt from template"
              continue
            fi

            if [ -z "$MIMO_API_KEY" ]; then
              echo "MIMO_API_KEY not set — cannot call AI"
              break
            fi

            # Escape prompt for JSON
            PROMPT_JSON=$(echo "$PROMPT" | jq -Rs '.')
            if [ -z "$PROMPT_JSON" ] || [ "$PROMPT_JSON" = "null" ]; then
              echo "ERROR: Failed to JSON-escape prompt"
              continue
            fi

            echo "Calling MiMo API (max_tokens: 100000)..."

            RESPONSE=$(curl -s --max-time 180 \
              -H "Authorization: Bearer $MIMO_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"mimo-v2.5\",\"messages\":[{\"role\":\"user\",\"content\":$PROMPT_JSON}],\"max_tokens\":100000,\"temperature\":0.1}" \
              "https://token-plan-sgp.xiaomimimo.com/v1/chat/completions" 2>/dev/null)

            echo "$RESPONSE" > .ci-results/last-response.json 2>/dev/null || true

            if [ -z "$RESPONSE" ]; then
              echo "ERROR: Empty response from API"
              echo "curl exit code: $?"
              continue
            fi

            # Check for API errors
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null)
            if [ -n "$API_ERROR" ]; then
              echo "API error: $API_ERROR"
              echo "Full response: $(echo "$RESPONSE" | head -c 500)"
              continue
            fi

            # MiMo reasoning model: content may be in content or reasoning_content
            # First try content, then reasoning_content
            CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' 2>/dev/null)
            if [ -z "$CONTENT" ]; then
              CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.reasoning_content // ""' 2>/dev/null)
            fi
            FINISH_REASON=$(echo "$RESPONSE" | jq -r '.choices[0].finish_reason // "unknown"' 2>/dev/null)
            echo "Finish reason: $FINISH_REASON"

            if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
              echo "AI returned empty response"
              echo "Raw response keys: $(echo "$RESPONSE" | jq 'keys' 2>/dev/null)"
              echo "Choices content preview: $(echo "$RESPONSE" | jq -r '.choices[0].message | keys' 2>/dev/null)"
              continue
            fi

            echo "Response length: ${#CONTENT} chars"

            # Strip markdown code fences if present
            CONTENT=$(echo "$CONTENT" | sed '/^```/d')

            # Extract JSON from response
            PARSED=$(echo "$CONTENT" | jq '.' 2>/dev/null)
            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              # Try extracting JSON block from text
              PARSED=$(echo "$CONTENT" | sed -n '/^{/,/^}/p' | jq '.' 2>/dev/null)
            fi

            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              echo "Failed to parse AI response as JSON"
              echo "Content preview: $(echo "$CONTENT" | head -c 500)"
              continue
            fi

            PATCH=$(echo "$PARSED" | jq -r '.patch // empty' 2>/dev/null)
            CONFIDENCE=$(echo "$PARSED" | jq -r '.confidence // 0' 2>/dev/null)
            ANALYSIS=$(echo "$PARSED" | jq -r '.analysis // "unknown"' 2>/dev/null)
            VERIFY=$(echo "$PARSED" | jq -r '.verify_cmd // "npm test -- --forceExit"' 2>/dev/null)

            echo "Analysis: $ANALYSIS"
            echo "Confidence: $CONFIDENCE"

            IS_LOW=$(echo "$CONFIDENCE" | jq 'if type == "number" and . < 0.5 then true else false end' 2>/dev/null)
            if [ "$IS_LOW" = "true" ]; then
              echo "Confidence too low. Skipping."
              continue
            fi

            if [ -z "$PATCH" ] || [ "$PATCH" = "null" ]; then
              echo "No patch generated. Skipping."
              continue
            fi

            echo "Patch length: ${#PATCH} chars"

            # Safety check: diffstat
            CHANGED_FILES=$(echo "$PATCH" | grep -cE '^(diff --git|--- a/)' || true)
            if [ "$CHANGED_FILES" -gt "$MAX_FILES" ]; then
              # Try the more specific pattern
              CHANGED_FILES=$(echo "$PATCH" | grep -c '^diff --git' || true)
            fi
            echo "Files changed in patch: $CHANGED_FILES"
            if [ "$CHANGED_FILES" -gt "$MAX_FILES" ]; then
              echo "Patch touches $CHANGED_FILES files (max $MAX_FILES). Skipping."
              continue
            fi

            # Block if patch touches secrets/config
            if echo "$PATCH" | grep -qiE '(\.env|firebase.*key|service.account|private.key)'; then
              echo "Patch touches sensitive files. Skipping."
              continue
            fi

            # Block deployment changes
            if echo "$PATCH" | grep -qiE '(vercel\.json|netlify\.toml|dockerfile|docker-compose|app\.yaml)'; then
              echo "Patch touches deployment config. Skipping."
              continue
            fi

            echo "$PATCH" > .ci-results/fix.patch

            APPLIED=false
            if git apply --check .ci-results/fix.patch 2>/dev/null; then
              git apply .ci-results/fix.patch
              APPLIED=true
            elif git apply --check --3way .ci-results/fix.patch 2>/dev/null; then
              git apply --3way .ci-results/fix.patch
              APPLIED=true
            else
              # Try to extract and apply individual file changes
              echo "Attempting partial patch extraction..."
              CURRENT_FILE=""
              PARTIAL_PATCH=""
              while IFS= read -r line; do
                if echo "$line" | grep -qE '^diff --git'; then
                  if [ -n "$CURRENT_FILE" ] && [ -n "$PARTIAL_PATCH" ]; then
                    echo "$PARTIAL_PATCH" > .ci-results/partial.patch
                    if git apply --check .ci-results/partial.patch 2>/dev/null; then
                      git apply .ci-results/partial.patch
                      APPLIED=true
                    fi
                    rm -f .ci-results/partial.patch
                  fi
                  CURRENT_FILE=$(echo "$line" | sed 's|diff --git a/\(.*\) b/.*|\1|')
                  PARTIAL_PATCH="$line"$'\n'
                elif [ -n "$CURRENT_FILE" ]; then
                  PARTIAL_PATCH+="$line"$'\n'
                fi
              done <<< "$PATCH"
              # Apply last chunk
              if [ -n "$CURRENT_FILE" ] && [ -n "$PARTIAL_PATCH" ]; then
                echo "$PARTIAL_PATCH" > .ci-results/partial.patch
                if git apply --check .ci-results/partial.patch 2>/dev/null; then
                  git apply .ci-results/partial.patch
                  APPLIED=true
                fi
                rm -f .ci-results/partial.patch
              fi
            fi

            if [ "$APPLIED" = "true" ]; then
              echo "Running verification: $VERIFY"
              if eval "$VERIFY" 2>&1; then
                echo ""
                echo "Fix verified on attempt $ATTEMPT"
                FIXED=true
              else
                echo "Verification failed. Reverting..."
                git checkout -- .
                rm -f .ci-results/fix.patch
              fi
            else
              echo "Patch does not apply cleanly. Reverting..."
              git checkout -- .
              rm -f .ci-results/fix.patch
            fi
          done

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
          echo "attempts=$ATTEMPT" >> $GITHUB_OUTPUT

      - name: Create draft PR
        if: steps.debug.outputs.fixed == 'true'
        run: |
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          ATTEMPTS="${{ steps.debug.outputs.attempts }}"

          git add -A
          COMMIT_MSG="fix: AI-generated patch for CI failure"$'\n\n'"Automated fix by ai-debug workflow."$'\n'"Attempts: $ATTEMPTS / $MAX_ATTEMPTS"$'\n'"Target: ${{ github.event.workflow_run.head_branch }}"$'\n\n'"Review before merging."
          git commit -m "$COMMIT_MSG"

          git push origin "$DEBUG_BRANCH"

          PR_BODY="## AI-Generated Fix"$'\n\n'
          PR_BODY+="**Target:** \`${{ github.event.workflow_run.head_branch }}\`"$'\n'
          PR_BODY+="**Failed run:** [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})"$'\n'
          PR_BODY+="**Attempts:** $ATTEMPTS / $MAX_ATTEMPTS"$'\n\n'
          PR_BODY+="### Safety Rules Enforced"$'\n'
          PR_BODY+="- Max ${MAX_FILES} files changed"$'\n'
          PR_BODY+="- No production secrets modified"$'\n'
          PR_BODY+="- No deployment triggered"$'\n'
          PR_BODY+="- Draft PR requires manual review"$'\n\n'
          PR_BODY+="### Verify Locally"$'\n'
          PR_BODY+='```bash'$'\n'
          PR_BODY+="git fetch origin $DEBUG_BRANCH"$'\n'
          PR_BODY+="git checkout $DEBUG_BRANCH"$'\n'
          PR_BODY+='npm run lint && npm test'$'\n'
          PR_BODY+='```'$'\n\n'
          PR_BODY+="Generated by ai-debug.yml"

          gh pr create --draft \
            --title "fix: AI patch for CI failure" \
            --body "$PR_BODY" \
            --head "$DEBUG_BRANCH" \
            --base "${{ github.event.workflow_run.head_branch }}"

          gh label create "ai-generated" --description "AI-generated fix" --color "8470e8" 2>/dev/null || true
          gh label create "needs-review" --description "Requires human review" --color "f5a623" 2>/dev/null || true
          PR_NUMBER=$(gh pr list --head "$DEBUG_BRANCH" --json number --jq '.[0].number')
          gh pr edit "$PR_NUMBER" --add-label "ai-generated,needs-review" 2>/dev/null || true
          echo "PR created: #$PR_NUMBER"

      - name: Create issue on failure
        if: steps.debug.outputs.fixed != 'true'
        run: |
          ISSUE_BODY="## CI Failure"$'\n\n'
          ISSUE_BODY+="**Branch:** \`${{ github.event.workflow_run.head_branch }}\`"$'\n'
          ISSUE_BODY+="**Run:** [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})"$'\n'
          ISSUE_BODY+="**Attempts:** ${{ steps.debug.outputs.attempts }} / $MAX_ATTEMPTS"$'\n\n'
          ISSUE_BODY+="AI debug agent could not resolve this. Manual fix needed."$'\n\n'
          ISSUE_BODY+="1. Check the [failed CI logs](${{ github.event.workflow_run.html_url }})"$'\n'
          ISSUE_BODY+="2. Fix manually"$'\n'
          ISSUE_BODY+="3. Push to trigger CI again"$'\n\n'
          ISSUE_BODY+="Generated by ai-debug.yml"

          gh label create "ci-failure" --description "CI is broken" --color "d73a4a" 2>/dev/null || true
          gh label create "needs-attention" --description "Requires investigation" --color "e99695" 2>/dev/null || true

          gh issue create \
            --title "CI failure — AI debug unsuccessful" \
            --body "$ISSUE_BODY" \
            --label "ci-failure,needs-attention" 2>/dev/null || \
          gh issue create \
            --title "CI failure — AI debug unsuccessful" \
            --body "$ISSUE_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git branch -D "${{ steps.debug.outputs.debug_branch }}" 2>/dev/null || true
          rm -rf .ci-results
