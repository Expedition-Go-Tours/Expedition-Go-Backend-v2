name: AI Debug

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  ai-debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MAX_ATTEMPTS: 3
      MAX_FILES: 10
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch failed logs
        run: |
          set +e
          mkdir -p .ci-results
          RUN_ID="${{ github.event.workflow_run.id }}"

          gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -500 > .ci-results/failed-logs.txt || true
          gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' \
            > .ci-results/failed-jobs.txt 2>/dev/null || true

          echo "${{ github.event.workflow_run.head_sha }}" > .ci-results/sha.txt
          echo "${{ github.event.workflow_run.head_branch }}" > .ci-results/branch.txt

          echo "=== Failed Jobs ==="
          cat .ci-results/failed-jobs.txt || echo "(none)"
          echo ""
          echo "=== Failed Logs (last 100 lines) ==="
          tail -100 .ci-results/failed-logs.txt || echo "(none)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run lint
        run: |
          mkdir -p .ci-results
          set +e
          npm run lint > .ci-results/lint-output.txt 2>&1
          LINT_EXIT=$?
          awk '
            /^[^[:space:]]/    { if ($0 ~ /\.(js|ts|jsx|tsx|mjs)$/) { f=$0 } else { f="" } }
            / error /          { if (f != "") { print f } ; print $0 }
          ' .ci-results/lint-output.txt > .ci-results/lint-errors.txt
          echo "Lint exit code: $LINT_EXIT"
          echo "Lint error lines: $(grep -c ' error ' .ci-results/lint-output.txt)"
          echo "--- lint errors (fed to AI) ---"
          cat .ci-results/lint-errors.txt

      - name: Run AI debug agent
        id: debug
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          set +e
          mkdir -p .ci-results
          echo "" > .ci-results/debug-log.txt

          DEBUG_BRANCH="ai-fix/$(date +%s)"
          git checkout -b "$DEBUG_BRANCH"

          # Read files
          FAIL_LOG=""
          FAIL_JOBS=""
          TEMPLATE=""
          if [ -f .ci-results/failed-logs.txt ]; then
            FAIL_LOG=$(cat .ci-results/failed-logs.txt | head -2000)
          fi
          if [ -f .ci-results/failed-jobs.txt ]; then
            FAIL_JOBS=$(cat .ci-results/failed-jobs.txt)
          fi
          if [ -f .github/workflows/ai-debug-prompt.txt ]; then
            TEMPLATE=$(cat .github/workflows/ai-debug-prompt.txt)
          fi

          # Lint failures are a separate failure mode from test failures.
          # Collect the error lines (with file paths) and also merge them into
          # FAIL_LOG so the file loader below picks up the affected files.
          LINT_ERRORS=""
          if [ -f .ci-results/lint-errors.txt ] && [ -s .ci-results/lint-errors.txt ]; then
            LINT_ERRORS=$(cat .ci-results/lint-errors.txt | head -200)
            FAIL_LOG="$FAIL_LOG"$'\n'"==== LINT ERRORS ===="$'\n'"$LINT_ERRORS"
          fi

          echo "FAIL_LOG length: ${#FAIL_LOG}" | tee -a .ci-results/debug-log.txt
          echo "FAIL_JOBS: $FAIL_JOBS" | tee -a .ci-results/debug-log.txt
          echo "TEMPLATE length: ${#TEMPLATE}" | tee -a .ci-results/debug-log.txt

          if [ -z "$TEMPLATE" ]; then
            echo "ERROR: ai-debug-prompt.txt not found or empty" | tee -a .ci-results/debug-log.txt
            echo "fixed=false" >> $GITHUB_OUTPUT
            echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
            echo "attempts=0" >> $GITHUB_OUTPUT
            echo "last_analysis=template not found" >> $GITHUB_OUTPUT
            echo "last_confidence=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          ATTEMPT=0
          FIXED=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && [ "$FIXED" = "false" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "=== AI Debug Attempt $ATTEMPT / $MAX_ATTEMPTS ===" | tee -a .ci-results/debug-log.txt

            # Read content of files mentioned in error logs (prefer source over test files)
            FILE_CONTEXT=""
            if [ -n "$FAIL_JOBS" ]; then
              RAW_PATHS=$(echo "$FAIL_LOG" | grep -oE '[a-zA-Z0-9_/.-]+\.(js|ts|jsx|tsx|mjs)' | sort -u)
              SRC_PATHS=$(echo "$RAW_PATHS" | grep -vE '(__tests__|/test/|/tests/|\.test\.|\.spec\.)' | head -5)
              if [ -z "$SRC_PATHS" ]; then
                SRC_PATHS=$(echo "$RAW_PATHS" | head -5)
              fi
              for FILE_PATH in $SRC_PATHS; do
                REL_PATH="$FILE_PATH"
                for PREFIX in "/home/runner/work/Expedition-Go-Backend-v2/Expedition-Go-Backend-v2/" "/home/runner/work/Expedition-Go-Backend-v2/" "/home/runner/work/"; do
                  if [[ "$REL_PATH" == "$PREFIX"* ]]; then
                    REL_PATH="${REL_PATH#$PREFIX}"
                    break
                  fi
                done
                SHORT_PATH=$(echo "$REL_PATH" | grep -oE '[^/]+/[^/]+/[^/]+$' || true)
                FINAL_PATH=""
                for CANDIDATE in "$REL_PATH" "$SHORT_PATH"; do
                  if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
                    FINAL_PATH="$CANDIDATE"
                    break
                  fi
                done
                if [ -n "$FINAL_PATH" ]; then
                  LINE_COUNT=$(wc -l < "$FINAL_PATH")
                  FILE_CONTEXT+=$'\n'"=== FILE: $FINAL_PATH ($LINE_COUNT lines) ==="$'\n'
                  rm -f /tmp/file_ctx_all.txt
                  nl -ba "$FINAL_PATH" 2>/dev/null > /tmp/file_ctx_all.txt
                  FILE_CONTEXT+=$(cat /tmp/file_ctx_all.txt)$'\n'
                  FILE_CONTEXT+=$'\n'"=== END FILE: $FINAL_PATH ==="$'\n'
                  rm -f /tmp/file_ctx_all.txt
                  echo "  Loaded: $FINAL_PATH ($LINE_COUNT lines)" | tee -a .ci-results/debug-log.txt
                else
                  echo "  Could not find: $FILE_PATH (tried $REL_PATH, $SHORT_PATH)" | tee -a .ci-results/debug-log.txt
                fi
              done
            else
              echo "  No FAIL_JOBS — skipping file loading" | tee -a .ci-results/debug-log.txt
            fi
            echo "FILE_CONTEXT length: ${#FILE_CONTEXT}" | tee -a .ci-results/debug-log.txt

            # Build prompt by writing values to files and substituting with jq --rawfile
            # (avoids sed special-char breakage AND jq --arg size limits)
            printf '%s' "$TEMPLATE" > /tmp/ai-template.txt
            printf '%s' "$FAIL_LOG" > /tmp/ai-fail-log.txt
            printf '%s' "$FAIL_JOBS" > /tmp/ai-fail-jobs.txt
            printf '%s' "$FILE_CONTEXT" > /tmp/ai-file-context.txt
            printf '%s' "$LINT_ERRORS" > /tmp/ai-lint-errors.txt

            PROMPT=$(jq -n --rawfile template /tmp/ai-template.txt \
              --rawfile log /tmp/ai-fail-log.txt \
              --rawfile jobs /tmp/ai-fail-jobs.txt \
              --rawfile files /tmp/ai-file-context.txt \
              --rawfile linterr /tmp/ai-lint-errors.txt \
              '$template | gsub("\\{\\{FAIL_LOG\\}\\}"; $log) | gsub("\\{\\{FAIL_JOBS\\}\\}"; $jobs) | gsub("\\{\\{FILE_CONTENTS\\}\\}"; $files) | gsub("\\{\\{LINT_ERRORS\\}\\}"; $linterr)' 2>.ci-results/jq-prompt-error.txt)
            if [ -z "$PROMPT" ]; then
              echo "ERROR: Failed to build prompt" | tee -a .ci-results/debug-log.txt
              echo "jq prompt error: $(cat .ci-results/jq-prompt-error.txt)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "PROMPT length: ${#PROMPT}" | tee -a .ci-results/debug-log.txt

            if [ -z "$MIMO_API_KEY" ]; then
              echo "MIMO_API_KEY not set" | tee -a .ci-results/debug-log.txt
              break
            fi

            # Build request body using --rawfile (prompt carries via file, avoids argv 128KB limit)
            printf '%s' "$PROMPT" > /tmp/ai-prompt.txt
            jq -n --rawfile prompt /tmp/ai-prompt.txt \
              '{model:"mimo-v2.5",messages:[{role:"user",content:$prompt}],max_tokens:100000,temperature:0.1}' \
              > /tmp/mimo_request.json 2>.ci-results/jq-error.txt

            if [ ! -s /tmp/mimo_request.json ]; then
              echo "ERROR: Failed to build request JSON" | tee -a .ci-results/debug-log.txt
              echo "jq error: $(cat .ci-results/jq-error.txt)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Request body size: $(wc -c < /tmp/mimo_request.json) bytes" | tee -a .ci-results/debug-log.txt
            echo "Calling MiMo API..." | tee -a .ci-results/debug-log.txt

            RESPONSE=$(curl -s --max-time 180 \
              -H "Authorization: Bearer $MIMO_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/mimo_request.json \
              "https://token-plan-sgp.xiaomimimo.com/v1/chat/completions" 2>/dev/null)

            echo "$RESPONSE" > .ci-results/last-response-attempt-$ATTEMPT.json 2>/dev/null || true

            if [ -z "$RESPONSE" ]; then
              echo "ERROR: Empty response from API (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Response size: ${#RESPONSE} bytes" | tee -a .ci-results/debug-log.txt

            # Check for API errors
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null)
            if [ -n "$API_ERROR" ]; then
              echo "API error: $API_ERROR" | tee -a .ci-results/debug-log.txt
              continue
            fi

            # Extract content - try content first, then reasoning_content
            CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' 2>/dev/null)
            FINISH_REASON=$(echo "$RESPONSE" | jq -r '.choices[0].finish_reason // "unknown"' 2>/dev/null)
            echo "Finish reason: $FINISH_REASON, Content length: ${#CONTENT}" | tee -a .ci-results/debug-log.txt

            if [ -z "$CONTENT" ]; then
              CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.reasoning_content // ""' 2>/dev/null)
              echo "Using reasoning_content fallback, length: ${#CONTENT}" | tee -a .ci-results/debug-log.txt
            fi

            if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
              echo "AI returned empty content (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              echo "Response keys: $(echo "$RESPONSE" | jq 'keys' 2>/dev/null)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Content length: ${#CONTENT} chars" | tee -a .ci-results/debug-log.txt

            # Strip markdown code fences
            CONTENT=$(echo "$CONTENT" | sed '/^```/d')

            # Extract JSON from response
            PARSED=$(echo "$CONTENT" | jq '.' 2>/dev/null)
            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              PARSED=$(echo "$CONTENT" | sed -n '/^{/,/^}/p' | jq '.' 2>/dev/null)
            fi

            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              echo "FAILED to parse JSON (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              echo "Content preview: $(echo "$CONTENT" | head -c 300)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "JSON parsed OK" | tee -a .ci-results/debug-log.txt
            ANALYSIS=$(echo "$PARSED" | jq -r '.analysis // "unknown"' 2>/dev/null)
            CONFIDENCE=$(echo "$PARSED" | jq -r '.confidence // 0' 2>/dev/null)

            echo "Analysis: $ANALYSIS" | tee -a .ci-results/debug-log.txt
            echo "Confidence: $CONFIDENCE" | tee -a .ci-results/debug-log.txt

            IS_LOW=$(echo "$CONFIDENCE" | jq 'if type == "number" and . < 0.5 then true else false end' 2>/dev/null)
            if [ "$IS_LOW" = "true" ]; then
              echo "Confidence too low ($CONFIDENCE). Skipping." | tee -a .ci-results/debug-log.txt
              continue
            fi

            APPLIED=false

            FIX_COUNT=$(echo "$PARSED" | jq -r '.fixes | length // 0' 2>/dev/null)
            if [ -n "$FIX_COUNT" ] && [ "$FIX_COUNT" != "null" ] && [ "$FIX_COUNT" -gt 0 ]; then
              echo "Applying $FIX_COUNT fix(es)..." | tee -a .ci-results/debug-log.txt
              for i in $(seq 0 $((FIX_COUNT - 1))); do
                FIX_FILE=$(echo "$PARSED" | jq -r ".fixes[$i].file" 2>/dev/null)
                FIX_ACTION=$(echo "$PARSED" | jq -r ".fixes[$i].action" 2>/dev/null)
                FIX_LINES=$(echo "$PARSED" | jq -r ".fixes[$i].line_numbers[]? // empty" 2>/dev/null)

                echo "  Fix $((i+1)): $FIX_ACTION on $FIX_FILE (lines: $FIX_LINES)" | tee -a .ci-results/debug-log.txt

                if [ ! -f "$FIX_FILE" ]; then
                  echo "  ERROR: File $FIX_FILE not found" | tee -a .ci-results/debug-log.txt
                  continue
                fi

                cp "$FIX_FILE" ".ci-results/fix-backup-$(echo $FIX_FILE | tr '/' '_')"

                if [ "$FIX_ACTION" = "remove_lines" ]; then
                  for LN in $(echo "$FIX_LINES" | sort -rn); do
                    sed -i "${LN}d" "$FIX_FILE"
                  done
                  APPLIED=true

                elif [ "$FIX_ACTION" = "replace_lines" ]; then
                  OLD_ARRAY=()
                  while IFS= read -r line; do OLD_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].old_lines[]? // empty" 2>/dev/null)"
                  NEW_ARRAY=()
                  while IFS= read -r line; do NEW_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].new_lines[]? // empty" 2>/dev/null)"
                  FIRST_LINE=$(echo "$FIX_LINES" | head -1)
                  OLD_COUNT=${#OLD_ARRAY[@]}
                  head -n $((FIRST_LINE - 1)) "$FIX_FILE" > /tmp/fix_top.txt
                  printf '%s\n' "${NEW_ARRAY[@]}" > /tmp/fix_mid.txt
                  tail -n +$((FIRST_LINE + OLD_COUNT)) "$FIX_FILE" > /tmp/fix_bot.txt
                  cat /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt > "$FIX_FILE"
                  rm -f /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt
                  APPLIED=true

                elif [ "$FIX_ACTION" = "add_lines" ]; then
                  INSERT_AFTER=$(echo "$FIX_LINES" | tail -1)
                  head -n "$INSERT_AFTER" "$FIX_FILE" > /tmp/fix_top.txt
                  NEW_ARRAY=()
                  while IFS= read -r line; do NEW_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].new_lines[]? // empty" 2>/dev/null)"
                  printf '%s\n' "${NEW_ARRAY[@]}" > /tmp/fix_mid.txt
                  tail -n +$((INSERT_AFTER + 1)) "$FIX_FILE" > /tmp/fix_bot.txt
                  cat /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt > "$FIX_FILE"
                  rm -f /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt
                  APPLIED=true
                fi
              done
            fi

            if [ "$APPLIED" = "true" ]; then
              VERIFY_CMD="$VERIFY"
              if [ -z "$VERIFY_CMD" ] || [ "$VERIFY_CMD" = "null" ]; then
                VERIFY_CMD="npm test -- --forceExit && npm run lint"
              fi
              echo "Running verification: $VERIFY_CMD" | tee -a .ci-results/debug-log.txt
              if bash -c "$VERIFY_CMD" 2>&1 | tee -a .ci-results/debug-log.txt; then
                echo "Fix verified on attempt $ATTEMPT" | tee -a .ci-results/debug-log.txt
                FIXED=true
              else
                echo "Verification failed. Reverting..." | tee -a .ci-results/debug-log.txt
                git checkout -- .
                rm -f .ci-results/fix-backup-*
              fi
            else
              echo "Could not apply fix (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
            fi
          done

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
          echo "attempts=$ATTEMPT" >> $GITHUB_OUTPUT
          echo "last_analysis=${ANALYSIS:-}" >> $GITHUB_OUTPUT
          echo "last_confidence=${CONFIDENCE:-}" >> $GITHUB_OUTPUT

          # Write step summary
          {
            echo "## AI Debug Agent - Attempt $ATTEMPT"
            echo ""
            echo "**Fixed:** $FIXED"
            echo "**Attempts:** $ATTEMPT / $MAX_ATTEMPTS"
            echo ""
            echo "### Debug Log"
            echo '```'
            cat .ci-results/debug-log.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Create draft PR
        if: steps.debug.outputs.fixed == 'true'
        run: |
          set +e
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          ATTEMPTS="${{ steps.debug.outputs.attempts }}"
          OUTPUT=".ci-results/pr-output.log"
          truncate -s 0 "$OUTPUT"
          {
            echo "## Create Draft PR - $DEBUG_BRANCH"
            echo "Running: $(date -u)"
            git config user.name "gideon211"
            git config user.email "gideon211@users.noreply.github.com"
            echo "--- status ---"
            git status --short
            git add -A -- . ':(exclude).ci-results'
            echo "--- commit ---"
            git commit -m "fix: AI-generated patch for CI failure"$'\n\n'"Automated fix by ai-debug workflow."$'\n'"Attempts: $ATTEMPTS / $MAX_ATTEMPTS"
            echo "commit exit code: $?"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Expedition-Go-Tours/Expedition-Go-Backend-v2.git"
            echo "--- push ---"
            git push origin "$DEBUG_BRANCH" 2>&1
            echo "push exit code: $?"
            echo "--- REST create PR ---"
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Expedition-Go-Tours/Expedition-Go-Backend-v2/pulls" \
              -d "{\"title\":\"fix: AI patch for CI failure\",\"head\":\"$DEBUG_BRANCH\",\"base\":\"${{ github.event.workflow_run.head_branch }}\",\"draft\":true,\"body\":\"AI-generated fix. Attempts: $ATTEMPTS / $MAX_ATTEMPTS. Review before merging.\"}"
            echo ""
            echo "pr-create exit code: $?"
          } 2>&1 | tee -a $GITHUB_STEP_SUMMARY "$OUTPUT"
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report PR step output
        if: steps.debug.outputs.fixed == 'true'
        run: |
          set +e
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          PR_NUM=$(gh pr list --head "$DEBUG_BRANCH" --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$PR_NUM" ] && [ -f .ci-results/pr-output.log ]; then
            LOG=$(cat .ci-results/pr-output.log | tail -c 6000)
            BODY=$(printf '## PR step log - %s\n\n```\n%s\n```\n' "$DEBUG_BRANCH" "$LOG")
            gh issue create \
              --title "AI Debug: fix applied, PR step output [$DEBUG_BRANCH]" \
              --body "$BODY" \
              --label "ci-failure" 2>/dev/null || \
            gh issue create \
              --title "AI Debug: fix applied, PR step output [$DEBUG_BRANCH]" \
              --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: steps.debug.outputs.fixed != 'true'
        run: |
          ISSUE_BODY="## CI Failure"$'\n\n'
          ISSUE_BODY+="**Branch:** \`${{ github.event.workflow_run.head_branch }}\`"$'\n'
          ISSUE_BODY+="**Run:** [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})"$'\n'
          ISSUE_BODY+="**Attempts:** ${{ steps.debug.outputs.attempts }} / $MAX_ATTEMPTS"$'\n'
          ISSUE_BODY+="**AI Analysis:** ${{ steps.debug.outputs.last_analysis }}"$'\n'
          ISSUE_BODY+="**AI Confidence:** ${{ steps.debug.outputs.last_confidence }}"$'\n\n'
          ISSUE_BODY+="AI debug agent could not resolve this. Manual fix needed."$'\n\n'
          ISSUE_BODY+="1. Check the [failed CI logs](${{ github.event.workflow_run.html_url }})"$'\n'
          ISSUE_BODY+="2. Fix manually"$'\n'
          ISSUE_BODY+="3. Push to trigger CI again"$'\n\n'
          ISSUE_BODY+="### AI Debug Log"$'\n'
          ISSUE_BODY+='```'$'\n'
          ISSUE_BODY+="$(cat .ci-results/debug-log.txt 2>/dev/null | tail -c 6000)"$'\n'
          ISSUE_BODY+='```'$'\n\n'
          ISSUE_BODY+="Generated by ai-debug.yml"

          gh label create "ci-failure" --description "CI is broken" --color "d73a4a" 2>/dev/null || true
          gh label create "needs-attention" --description "Requires investigation" --color "e99695" 2>/dev/null || true

          gh issue create \
            --title "CI failure — AI debug unsuccessful" \
            --body "$ISSUE_BODY" \
            --label "ci-failure,needs-attention" 2>/dev/null || \
          gh issue create \
            --title "CI failure — AI debug unsuccessful" \
            --body "$ISSUE_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save debug artifacts
        if: always()
        run: |
          mkdir -p /tmp/ai-debug-artifacts
          cp -r .ci-results/* /tmp/ai-debug-artifacts/ 2>/dev/null || true
          echo "Artifacts saved: $(ls /tmp/ai-debug-artifacts/ 2>/dev/null | tr '\n' ', ')"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-artifacts
          path: /tmp/ai-debug-artifacts/
          retention-days: 5

      - name: Cleanup
        if: always()
        run: |
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git branch -D "${{ steps.debug.outputs.debug_branch }}" 2>/dev/null || true
          rm -rf .ci-results /tmp/ai-debug-artifacts
