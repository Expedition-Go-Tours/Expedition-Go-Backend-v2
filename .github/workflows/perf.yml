name: Performance Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?connection_limit=50
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test?connection_limit=50
  JWT_SECRET: perf-jwt-secret
  JWT_REFRESH_SECRET: perf-jwt-refresh-secret
  JWT_EXPIRES_IN: 90d
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  CLOUDINARY_CLOUD_NAME: dummy
  CLOUDINARY_API_KEY: '000000000000000'
  CLOUDINARY_API_SECRET: dummy-secret
  SENDGRID_API_KEY: SG.dummy
  FIREBASE_PROJECT_ID: dummy-project
  FIREBASE_CLIENT_EMAIL: dummy@dummy.com
  FIREBASE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    dummy-key
    -----END PRIVATE KEY-----
  SENTRY_DSN: ''
  ALLOWED_ORIGINS: http://localhost:3000
  REDIS_URL: redis://localhost:6379
  RATELIMIT_GLOBAL_MAX: '100000'
  RATELIMIT_CHECKOUT_CALCULATE_MAX: '100000'

jobs:
  k6:
    strategy:
      fail-fast: false
      matrix:
        scenario: [tourListing, checkoutFlow, mixed]
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed permissions and roles
        run: node prisma/seed.js

      - name: Seed performance test data
        run: node prisma/seedPerf.js

      - name: Create k6 output directory
        run: mkdir -p k6-output && touch k6-output/.gitkeep

      - name: Start application in background
        run: |
          node server.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Server is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Warm up Redis cache
        run: |
          echo "Warming up tours listing..."
          curl -sf http://localhost:5000/api/expedition/tours > /dev/null
          echo "Warming up tour detail..."
          curl -sf http://localhost:5000/api/expedition/tours/perf-safari-adventure > /dev/null
          echo "Warm-up complete"

      - name: Install k6
        run: |
          curl -sL -o k6.tar.gz https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz
          tar xzf k6.tar.gz
          sudo cp k6-v2.1.0-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Run k6 — ${{ matrix.scenario }}
        run: |
          k6 run __tests__/performance/k6/scenarios/${{ matrix.scenario }}.js \
            --summary-export k6-output/summary.json \
            --out json=k6-output/performance-report.json

      - name: Generate HTML summary
        if: always()
        run: node scripts/k6SummaryToHtml.js k6-output/summary.json k6-output/summary.html

      - name: Upload k6 artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-${{ matrix.scenario }}
          path: k6-output/

      - name: Notify perf results
        if: always()
        run: |
          DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_DEPLOY_WEBHOOK }}"
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          [ ! -f k6-output/summary.json ] && exit 0

          SCENARIO="${{ matrix.scenario }}"
          PASSED=$(jq -r '.state.passed // false' k6-output/summary.json)
          P95=$(jq -r '.metrics.http_req_duration.values["p(95)"] // "N/A"' k6-output/summary.json)
          P99=$(jq -r '.metrics.http_req_duration.values["p(99)"] // "N/A"' k6-output/summary.json)
          FAIL_RATE=$(jq -r '.metrics.http_req_failed.values.rate // "N/A"' k6-output/summary.json)
          CHECKS_PASSED=$(jq -r '.state.checks.passed // 0' k6-output/summary.json)
          CHECKS_FAILED=$(jq -r '.state.checks.failed // 0' k6-output/summary.json)
          AVG=$(jq -r '.metrics.http_req_duration.values.avg // "N/A"' k6-output/summary.json)

          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "n/a")
          SUBJECT=$(git log -1 --pretty='%s' 2>/dev/null || echo "n/a")
          AUTHOR=$(git log -1 --pretty='%an' 2>/dev/null || echo "n/a")

          if [ "$PASSED" = "true" ]; then
            TITLE="Performance Test Passed — ${SCENARIO}"
            COLOR=5025616
            ICON="PASS"
          else
            TITLE="Performance Test Failed — ${SCENARIO}"
            COLOR=15548997
            ICON="FAIL"
          fi

          # Format numbers
          if echo "$P95" | grep -qE '^[0-9]'; then P95="${P95}ms"; fi
          if echo "$P99" | grep -qE '^[0-9]'; then P99="${P99}ms"; fi
          if echo "$AVG" | grep -qE '^[0-9]'; then AVG="${AVG}ms"; fi
          if echo "$FAIL_RATE" | grep -qE '^[0-9]'; then FAIL_RATE="$(echo "$FAIL_RATE * 100" | bc 2>/dev/null || echo "$FAIL_RATE")%"; fi

          cat > /tmp/discord-payload.json << JSONEOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "Scenario: \`${SCENARIO}\`",
              "color": ${COLOR},
              "fields": [
                { "name": "p95 Latency", "value": "${P95}", "inline": true },
                { "name": "p99 Latency", "value": "${P99}", "inline": true },
                { "name": "Avg Latency", "value": "${AVG}", "inline": true },
                { "name": "HTTP Fail Rate", "value": "${FAIL_RATE}", "inline": true },
                { "name": "Checks", "value": "${CHECKS_PASSED} passed / ${CHECKS_FAILED} failed", "inline": true },
                { "name": "Commit", "value": "\`${SHORT_SHA}\` ${SUBJECT}", "inline": false },
                { "name": "Run", "value": "[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true }
              ],
              "timestamp": "${{ github.event.head_commit.timestamp || '' }}"
            }]
          }
          JSONEOF
          bash scripts/discordSendEmbed.sh "$DISCORD_WEBHOOK_URL" /tmp/discord-payload.json

      - name: Kill application
        if: always()
        run: kill ${{ env.APP_PID }} || true
