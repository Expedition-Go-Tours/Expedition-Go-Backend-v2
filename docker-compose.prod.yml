services:
  app:
    build: .
    container_name: travio-app
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    expose:
      - "5000"
    networks:
      - travio
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  redis:
    image: redis:7-alpine
    container_name: travio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - travio
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: travio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - uptime-kuma
    networks:
      - travio

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: travio-uptime-kuma
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - uptimekuma:/app/data
    networks:
      - travio

networks:
  travio:
    driver: bridge

volumes:
  redisdata:
  caddydata:
  caddyconfig:
  uptimekuma:
