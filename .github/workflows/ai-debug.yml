name: AI Debug

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ai-debug-fix
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  ai-debug:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAX_ATTEMPTS: 3
      MAX_FILES: 10
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: '000000000000000'
      CLOUDINARY_API_SECRET: dummy-secret
      SENDGRID_API_KEY: SG.dummy
      FIREBASE_PROJECT_ID: dummy-project
      FIREBASE_CLIENT_EMAIL: dummy@dummy.com
      ALLOWED_ORIGINS: http://localhost:3000
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Fetch failed logs
        run: |
          set +e
          mkdir -p .ci-results
          RUN_ID="${{ github.event.workflow_run.id }}"

          gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -2000 > .ci-results/failed-logs.txt || true
          gh run view "$RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' \
            > .ci-results/failed-jobs.txt 2>/dev/null || true

          echo "${{ github.event.workflow_run.head_sha }}" > .ci-results/sha.txt
          echo "${{ github.event.workflow_run.head_branch }}" > .ci-results/branch.txt

          echo "=== Failed Jobs ==="
          cat .ci-results/failed-jobs.txt || echo "(none)"
          echo ""
          echo "=== Failed Logs (last 100 lines) ==="
          tail -100 .ci-results/failed-logs.txt || echo "(none)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run lint
        run: |
          mkdir -p .ci-results
          set +e
          npm run lint > .ci-results/lint-output.txt 2>&1
          LINT_EXIT=$?
          awk '
            /^[^[:space:]]/    { if ($0 ~ /\.(js|ts|jsx|tsx|mjs)$/) { f=$0 } else { f="" } }
            / error /          { if (f != "") { print f } ; print $0 }
          ' .ci-results/lint-output.txt > .ci-results/lint-errors.txt
          echo "Lint exit code: $LINT_EXIT"
          echo "Lint error lines: $(grep -c ' error ' .ci-results/lint-output.txt)"
          echo "--- lint errors (fed to AI) ---"
          cat .ci-results/lint-errors.txt

      - name: Prepare test database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.js

      - name: Run AI debug agent
        id: debug
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          set +e
          mkdir -p .ci-results
          echo "" > .ci-results/debug-log.txt

          DEBUG_BRANCH="ai-fix/$(date +%s)"
          git checkout -b "$DEBUG_BRANCH"

          # Rebase onto current main so the fix applies to the latest code and
          # the PR never targets a stale base (avoids "fix" PRs that no longer apply).
          git fetch origin main 2>/dev/null || true
          if git rebase origin/main 2>/dev/null; then
            echo "Rebased ai-fix branch onto current origin/main" | tee -a .ci-results/debug-log.txt
          else
            git rebase --abort 2>/dev/null || true
            echo "Rebase conflict — keeping original failing base" | tee -a .ci-results/debug-log.txt
          fi

          # Read files
          FAIL_LOG=""
          FAIL_JOBS=""
          TEMPLATE=""
          if [ -f .ci-results/failed-logs.txt ]; then
            FAIL_LOG=$(cat .ci-results/failed-logs.txt | head -2000)
          fi
          if [ -f .ci-results/failed-jobs.txt ]; then
            FAIL_JOBS=$(cat .ci-results/failed-jobs.txt)
          fi
          if [ -f .github/workflows/ai-debug-prompt.txt ]; then
            TEMPLATE=$(cat .github/workflows/ai-debug-prompt.txt)
          fi

          # Lint failures are a separate failure mode from test failures.
          # Collect the error lines (with file paths) and also merge them into
          # FAIL_LOG so the file loader below picks up the affected files.
          LINT_ERRORS=""
          if [ -f .ci-results/lint-errors.txt ] && [ -s .ci-results/lint-errors.txt ]; then
            LINT_ERRORS=$(cat .ci-results/lint-errors.txt | head -200)
            FAIL_LOG="$FAIL_LOG"$'\n'"==== LINT ERRORS ===="$'\n'"$LINT_ERRORS"
          fi

          # Guard: if startup-check is the ONLY failing job and it failed on a
          # Docker pull (infra flake, not code), skip the AI loop and do NOT
          # open an issue — nothing for the agent to fix.
          SKIP_REASON=""
          if [ "$(echo "$FAIL_JOBS" | tr -d '[:space:]')" = "startup-check" ]; then
            if grep -q "Docker pull failed" .ci-results/failed-logs.txt 2>/dev/null; then
              SKIP_REASON="infra_flake"
            fi
          fi
          if [ "$SKIP_REASON" = "infra_flake" ]; then
            echo "Skipping AI: only startup-check Docker pull flake detected (infra, not code)" | tee -a .ci-results/debug-log.txt
            echo "fixed=false" >> $GITHUB_OUTPUT
            echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
            echo "attempts=0" >> $GITHUB_OUTPUT
            echo "last_analysis=startup-check Docker pull infra flake; no code change attempted" >> $GITHUB_OUTPUT
            echo "last_confidence=0" >> $GITHUB_OUTPUT
            echo "skip_reason=infra_flake" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "FAIL_LOG length: ${#FAIL_LOG}" | tee -a .ci-results/debug-log.txt
          echo "FAIL_JOBS: $FAIL_JOBS" | tee -a .ci-results/debug-log.txt
          echo "TEMPLATE length: ${#TEMPLATE}" | tee -a .ci-results/debug-log.txt

          if [ -z "$TEMPLATE" ]; then
            echo "ERROR: ai-debug-prompt.txt not found or empty" | tee -a .ci-results/debug-log.txt
            echo "fixed=false" >> $GITHUB_OUTPUT
            echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
            echo "attempts=0" >> $GITHUB_OUTPUT
            echo "last_analysis=template not found" >> $GITHUB_OUTPUT
            echo "last_confidence=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          ATTEMPT=0
          FIXED=false
          ATTEMPT_FEEDBACK=""

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && [ "$FIXED" = "false" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "=== AI Debug Attempt $ATTEMPT / $MAX_ATTEMPTS ===" | tee -a .ci-results/debug-log.txt

            # ── Precise file retrieval ─────────────────────────────────
            # Parse structured failure output instead of grepping random
            # .js paths from the log (old loader grabbed app.js/config noise
            # and never gave the AI the files that actually failed).
            FILE_CONTEXT=""
            REL_FILES=$(mktemp); > "$REL_FILES"

            # 1) Jest suite failures:  "... [jest] FAIL __tests__/api/homepage.test.js"
            #    (log lines carry timestamp prefixes, so FAIL is NOT line-anchored)
            echo "$FAIL_LOG" | grep -oE 'FAIL [a-zA-Z0-9_/.-]+\.(test|spec)\.js' | awk '{print $2}' >> "$REL_FILES" || true

            # 2) Jest stack frames:    "at fn (__tests__/api/homepage.test.js:117:40)"
            #    and source frames referencing src files (allow trailing :line[:col]).
            echo "$FAIL_LOG" | grep -oE '\((controllers|utils|routes|middleware|models|services|__tests__)/[a-zA-Z0-9_/.-]+\.(js|ts|mjs|cjs)(:[0-9]+(:[0-9]+)?)?\)' \
              | sed -E 's/^\((.*)\)$/\1/' | sed -E 's/:[0-9]+(:[0-9]+)?$//' >> "$REL_FILES" || true

            # 3) ESLint errors (already extracted to lint-errors.txt with file paths)
            if [ -s .ci-results/lint-errors.txt ]; then
              grep -oE '^[a-zA-Z0-9_/.-]+\.(js|ts|jsx|tsx|mjs)$' .ci-results/lint-errors.txt >> "$REL_FILES" || true
            fi

            # Strip CI runner root prefixes to repo-relative paths
            sed -i -E 's#^/home/runner/work/[^/]+/[^/]+/##' "$REL_FILES"

            sort -u "$REL_FILES" -o "$REL_FILES"

            # 4) test→source mapping: for each failing test, add the likely
            #    source files so the model sees both sides of the contract.
            MAPPED=$(mktemp); > "$MAPPED"
            while IFS= read -r TEST_PATH; do
              case "$TEST_PATH" in
                __tests__/*)
                  STEM=$(basename "$TEST_PATH" .js)
                  STEM=${STEM%.test}; STEM=${STEM%.spec}
                  for C in \
                    "controllers/${STEM}Controller.js" \
                    "controllers/${STEM}AdminController.js" \
                    "controllers/admin${STEM}.js" \
                    "routes/${STEM}Routes.js" \
                    "routes/${STEM}AdminRoutes.js" \
                    "utils/${STEM}.js" \
                    "utils/${STEM}Service.js" \
                    "utils/${STEM}Helpers.js" \
                    "middleware/${STEM}.js" \
                    "models/${STEM}.js"; do
                    [ -f "$C" ] && echo "$C" >> "$MAPPED"
                  done
                  ;;
              esac
            done < "$REL_FILES"
            cat "$MAPPED" >> "$REL_FILES"

            # Always include config context
            echo "package.json" >> "$REL_FILES"
            echo "jest.config.js" >> "$REL_FILES"

            sort -u "$REL_FILES" -o "$REL_FILES"
            CONTEXT_MAX=14
            FILES_TO_LOAD=$(head -n "$CONTEXT_MAX" "$REL_FILES")

            for REL_PATH in $FILES_TO_LOAD; do
              if [ -f "$REL_PATH" ]; then
                LINE_COUNT=$(wc -l < "$REL_PATH")
                FILE_CONTEXT+=$'\n'"=== FILE: $REL_PATH ($LINE_COUNT lines) ==="$'\n'
                FILE_CONTEXT+=$(nl -ba "$REL_PATH" 2>/dev/null)$'\n'
                FILE_CONTEXT+=$'\n'"=== END FILE: $REL_PATH ==="$'\n'
                echo "  Loaded: $REL_PATH ($LINE_COUNT lines)" | tee -a .ci-results/debug-log.txt
              else
                echo "  Skipped (not found): $REL_PATH" | tee -a .ci-results/debug-log.txt
              fi
            done
            rm -f "$REL_FILES" "$MAPPED"
            echo "FILE_CONTEXT length: ${#FILE_CONTEXT}" | tee -a .ci-results/debug-log.txt

            # Build prompt by writing values to files and substituting with jq --rawfile
            # (avoids sed special-char breakage AND jq --arg size limits)
            printf '%s' "$TEMPLATE" > /tmp/ai-template.txt
            printf '%s' "$FAIL_LOG" > /tmp/ai-fail-log.txt
            printf '%s' "$FAIL_JOBS" > /tmp/ai-fail-jobs.txt
            printf '%s' "$FILE_CONTEXT" > /tmp/ai-file-context.txt
            printf '%s' "$LINT_ERRORS" > /tmp/ai-lint-errors.txt
            printf '%s' "$ATTEMPT_FEEDBACK" > /tmp/ai-feedback.txt

            PROMPT=$(jq -n --rawfile template /tmp/ai-template.txt \
              --rawfile log /tmp/ai-fail-log.txt \
              --rawfile jobs /tmp/ai-fail-jobs.txt \
              --rawfile files /tmp/ai-file-context.txt \
              --rawfile linterr /tmp/ai-lint-errors.txt \
              --rawfile feedback /tmp/ai-feedback.txt \
              '$template | gsub("\\{\\{FAIL_LOG\\}\\}"; $log) | gsub("\\{\\{FAIL_JOBS\\}\\}"; $jobs) | gsub("\\{\\{FILE_CONTENTS\\}\\}"; $files) | gsub("\\{\\{LINT_ERRORS\\}\\}"; $linterr) | gsub("\\{\\{PREV_ATTEMPT_FEEDBACK\\}\\}"; $feedback)' 2>.ci-results/jq-prompt-error.txt)
            if [ -z "$PROMPT" ]; then
              echo "ERROR: Failed to build prompt" | tee -a .ci-results/debug-log.txt
              echo "jq prompt error: $(cat .ci-results/jq-prompt-error.txt)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "PROMPT length: ${#PROMPT}" | tee -a .ci-results/debug-log.txt

            if [ -z "$MIMO_API_KEY" ]; then
              echo "MIMO_API_KEY not set" | tee -a .ci-results/debug-log.txt
              break
            fi

            # Build request body using --rawfile (prompt carries via file, avoids argv 128KB limit)
            printf '%s' "$PROMPT" > /tmp/ai-prompt.txt
            MODEL="${AI_MODEL:-mimo-v2.5}"
            jq -n --rawfile prompt /tmp/ai-prompt.txt --arg model "$MODEL" \
              '{model:$model,messages:[{role:"user",content:$prompt}],max_tokens:100000,temperature:0.1}' \
              > /tmp/mimo_request.json 2>.ci-results/jq-error.txt

            if [ ! -s /tmp/mimo_request.json ]; then
              echo "ERROR: Failed to build request JSON" | tee -a .ci-results/debug-log.txt
              echo "jq error: $(cat .ci-results/jq-error.txt)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Request body size: $(wc -c < /tmp/mimo_request.json) bytes" | tee -a .ci-results/debug-log.txt
            echo "Calling MiMo API..." | tee -a .ci-results/debug-log.txt

            RESPONSE=$(curl -s --max-time 180 \
              -H "Authorization: Bearer $MIMO_API_KEY" \
              -H "Content-Type: application/json" \
              -d @/tmp/mimo_request.json \
              "https://token-plan-sgp.xiaomimimo.com/v1/chat/completions" 2>/dev/null)

            echo "$RESPONSE" > .ci-results/last-response-attempt-$ATTEMPT.json 2>/dev/null || true

            if [ -z "$RESPONSE" ]; then
              echo "ERROR: Empty response from API (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Response size: ${#RESPONSE} bytes" | tee -a .ci-results/debug-log.txt

            # Check for API errors
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null)
            if [ -n "$API_ERROR" ]; then
              echo "API error: $API_ERROR" | tee -a .ci-results/debug-log.txt
              continue
            fi

            # Extract content - try content first, then reasoning_content
            CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' 2>/dev/null)
            FINISH_REASON=$(echo "$RESPONSE" | jq -r '.choices[0].finish_reason // "unknown"' 2>/dev/null)
            echo "Finish reason: $FINISH_REASON, Content length: ${#CONTENT}" | tee -a .ci-results/debug-log.txt

            if [ -z "$CONTENT" ]; then
              CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.reasoning_content // ""' 2>/dev/null)
              echo "Using reasoning_content fallback, length: ${#CONTENT}" | tee -a .ci-results/debug-log.txt
            fi

            if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
              echo "AI returned empty content (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              echo "Response keys: $(echo "$RESPONSE" | jq 'keys' 2>/dev/null)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "Content length: ${#CONTENT} chars" | tee -a .ci-results/debug-log.txt

            # Strip markdown code fences
            CONTENT=$(echo "$CONTENT" | sed '/^```/d')

            # Extract JSON from response
            PARSED=$(echo "$CONTENT" | jq '.' 2>/dev/null)
            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              PARSED=$(echo "$CONTENT" | sed -n '/^{/,/^}/p' | jq '.' 2>/dev/null)
            fi

            if [ -z "$PARSED" ] || [ "$PARSED" = "null" ]; then
              echo "FAILED to parse JSON (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              echo "Content preview: $(echo "$CONTENT" | head -c 300)" | tee -a .ci-results/debug-log.txt
              continue
            fi

            echo "JSON parsed OK" | tee -a .ci-results/debug-log.txt
            ANALYSIS=$(echo "$PARSED" | jq -r '.analysis // "unknown"' 2>/dev/null)
            CONFIDENCE=$(echo "$PARSED" | jq -r '.confidence // 0' 2>/dev/null)

            echo "Analysis: $ANALYSIS" | tee -a .ci-results/debug-log.txt
            echo "Confidence: $CONFIDENCE" | tee -a .ci-results/debug-log.txt

            # Persist analysis to a file so downstream steps can read it via
            # jq --rawfile instead of interpolating it into shell strings
            # (AI text with quotes/dollars would otherwise break the script).
            printf '%s' "$ANALYSIS" > .ci-results/last-analysis.txt 2>/dev/null || true

            IS_LOW=$(echo "$CONFIDENCE" | jq 'if type == "number" and . < 0.5 then true else false end' 2>/dev/null)
            if [ "$IS_LOW" = "true" ]; then
              echo "Confidence too low ($CONFIDENCE). Skipping." | tee -a .ci-results/debug-log.txt
              continue
            fi

            APPLIED=false

            FIX_COUNT=$(echo "$PARSED" | jq -r '.fixes | length // 0' 2>/dev/null)
            if [ -n "$FIX_COUNT" ] && [ "$FIX_COUNT" != "null" ] && [ "$FIX_COUNT" -gt 0 ]; then
              echo "Applying $FIX_COUNT fix(es)..." | tee -a .ci-results/debug-log.txt
              for i in $(seq 0 $((FIX_COUNT - 1))); do
                FIX_FILE=$(echo "$PARSED" | jq -r ".fixes[$i].file" 2>/dev/null)
                FIX_ACTION=$(echo "$PARSED" | jq -r ".fixes[$i].action" 2>/dev/null)
                FIX_LINES=$(echo "$PARSED" | jq -r ".fixes[$i].line_numbers[]? // empty" 2>/dev/null)

                echo "  Fix $((i+1)): $FIX_ACTION on $FIX_FILE (lines: $FIX_LINES)" | tee -a .ci-results/debug-log.txt

                if [ ! -f "$FIX_FILE" ]; then
                  echo "  ERROR: File $FIX_FILE not found" | tee -a .ci-results/debug-log.txt
                  continue
                fi

                cp "$FIX_FILE" ".ci-results/fix-backup-$(echo $FIX_FILE | tr '/' '_')"

                if [ "$FIX_ACTION" = "write_file" ]; then
                  NEW_ARRAY=()
                  while IFS= read -r line; do NEW_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].new_lines[]? // empty" 2>/dev/null)"
                  printf '%s\n' "${NEW_ARRAY[@]}" > "$FIX_FILE"
                  APPLIED=true

                elif [ "$FIX_ACTION" = "remove_lines" ]; then
                  for LN in $(echo "$FIX_LINES" | sort -rn); do
                    sed -i "${LN}d" "$FIX_FILE"
                  done
                  APPLIED=true

                elif [ "$FIX_ACTION" = "replace_lines" ]; then
                  OLD_ARRAY=()
                  while IFS= read -r line; do OLD_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].old_lines[]? // empty" 2>/dev/null)"
                  NEW_ARRAY=()
                  while IFS= read -r line; do NEW_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].new_lines[]? // empty" 2>/dev/null)"
                  FIRST_LINE=$(echo "$FIX_LINES" | head -1)
                  OLD_COUNT=${#OLD_ARRAY[@]}
                  head -n $((FIRST_LINE - 1)) "$FIX_FILE" > /tmp/fix_top.txt
                  printf '%s\n' "${NEW_ARRAY[@]}" > /tmp/fix_mid.txt
                  tail -n +$((FIRST_LINE + OLD_COUNT)) "$FIX_FILE" > /tmp/fix_bot.txt
                  cat /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt > "$FIX_FILE"
                  rm -f /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt
                  APPLIED=true

                elif [ "$FIX_ACTION" = "add_lines" ]; then
                  INSERT_AFTER=$(echo "$FIX_LINES" | tail -1)
                  head -n "$INSERT_AFTER" "$FIX_FILE" > /tmp/fix_top.txt
                  NEW_ARRAY=()
                  while IFS= read -r line; do NEW_ARRAY+=("$line"); done <<< "$(echo "$PARSED" | jq -r ".fixes[$i].new_lines[]? // empty" 2>/dev/null)"
                  printf '%s\n' "${NEW_ARRAY[@]}" > /tmp/fix_mid.txt
                  tail -n +$((INSERT_AFTER + 1)) "$FIX_FILE" > /tmp/fix_bot.txt
                  cat /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt > "$FIX_FILE"
                  rm -f /tmp/fix_top.txt /tmp/fix_mid.txt /tmp/fix_bot.txt
                  APPLIED=true
                fi
              done
            fi

            if [ "$APPLIED" = "true" ]; then
              # Diff guard: reject unsafe patches BEFORE verification.
              echo "Running ai-diff-guard..." | tee -a .ci-results/debug-log.txt
              node scripts/ai-diff-guard.js > .ci-results/diff-guard-output.txt 2>&1
              DIFF_GUARD_EXIT=$?
              cat .ci-results/diff-guard-output.txt | tee -a .ci-results/debug-log.txt
              if [ "$DIFF_GUARD_EXIT" != "0" ]; then
                echo "Diff guard rejected the patch. Reverting..." | tee -a .ci-results/debug-log.txt
                ATTEMPT_FEEDBACK="Attempt $ATTEMPT was REJECTED by the diff guard. Reason: $(cat .ci-results/diff-guard-output.txt 2>/dev/null | tail -8 | tr '\n' ' ')"
                git checkout -- .
                rm -f .ci-results/fix-backup-*
                continue
              fi

              VERIFY_CMD="$VERIFY"
              if [ -z "$VERIFY_CMD" ] || [ "$VERIFY_CMD" = "null" ]; then
                VERIFY_CMD="npm test -- --forceExit && npm run lint"
              fi
              echo "Running verification: $VERIFY_CMD" | tee -a .ci-results/debug-log.txt
              if bash -c "$VERIFY_CMD" > .ci-results/verify-output.txt 2>&1; then
                cat .ci-results/verify-output.txt | tee -a .ci-results/debug-log.txt
                echo "Fix verified on attempt $ATTEMPT" | tee -a .ci-results/debug-log.txt
                FIXED=true
              else
                cat .ci-results/verify-output.txt | tee -a .ci-results/debug-log.txt
                echo "Verification failed. Reverting..." | tee -a .ci-results/debug-log.txt
                ATTEMPT_FEEDBACK="Attempt $ATTEMPT applied changes but verification FAILED. Last output: $(tail -30 .ci-results/verify-output.txt 2>/dev/null | tr '\n' ' ')"
                git checkout -- .
                rm -f .ci-results/fix-backup-*
              fi
            else
              echo "Could not apply fix (attempt $ATTEMPT)" | tee -a .ci-results/debug-log.txt
              ATTEMPT_FEEDBACK="Attempt $ATTEMPT: the model returned fixes but they could not be applied (file not found or no applicable actions)."
            fi
          done

          # Failure signature for dedup — same failing jobs + failing test files
          # = same underlying bug, regardless of which CI run triggered it.
          SIG=$( { echo "$FAIL_JOBS"; echo "$FAIL_LOG" | grep -oE '__tests__/[a-zA-Z0-9_/.-]+\.(test|spec)\.js' | sort -u; } | sha1sum | cut -c1-16 )

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "debug_branch=$DEBUG_BRANCH" >> $GITHUB_OUTPUT
          echo "attempts=$ATTEMPT" >> $GITHUB_OUTPUT
          echo "last_analysis=${ANALYSIS:-}" >> $GITHUB_OUTPUT
          echo "sig=$SIG" >> $GITHUB_OUTPUT
          echo "last_confidence=${CONFIDENCE:-}" >> $GITHUB_OUTPUT

          # Write step summary
          {
            echo "## AI Debug Agent - Attempt $ATTEMPT"
            echo ""
            echo "**Fixed:** $FIXED"
            echo "**Attempts:** $ATTEMPT / $MAX_ATTEMPTS"
            echo ""
            echo "### Debug Log"
            echo '```'
            cat .ci-results/debug-log.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Create draft PR
        if: steps.debug.outputs.fixed == 'true'
        run: |
          set +e
          set -o pipefail
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          ATTEMPTS="${{ steps.debug.outputs.attempts }}"
          ANALYSIS="$(cat .ci-results/last-analysis.txt 2>/dev/null || true)"
          SIG="${{ steps.debug.outputs.sig }}"
          REPO="Expedition-Go-Tours/Expedition-Go-Backend-v2"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          BASE_SHA="${{ github.event.workflow_run.head_sha }}"
          FAIL_JOBS_RAW=$(cat .ci-results/failed-jobs.txt 2>/dev/null | tr '\n' ', ' | sed 's/,$//')
          OUTPUT=".ci-results/pr-output.log"
          truncate -s 0 "$OUTPUT"
          {
            echo "## Create Draft PR - $DEBUG_BRANCH"
            echo "Running: $(date -u)"

            # ── Dedup: same failure signature already has an open ai-fix PR ──
            if [ -n "$SIG" ]; then
              EXISTING=$(gh pr list --repo "$REPO" --state open --json number,headRefName,body --limit 100 2>/dev/null \
                | jq -r --arg sig "ai-sig:$SIG" '.[] | select(.headRefName | startswith("ai-fix")) | select(.body | contains($sig)) | .number' | head -1)
              if [ -n "$EXISTING" ]; then
                echo "Duplicate failure signature ($SIG) — open PR #$EXISTING already covers it. Skipping."
                gh pr comment "$EXISTING" --repo "$REPO" --body "Another CI failure matched this same signature ($SIG). Attempts: $ATTEMPTS/3. Review #$EXISTING if still failing." 2>/dev/null || true
                exit 0
              fi
              echo "No existing PR with signature $SIG — creating a new one."
            fi

            git config user.name "gideon211"
            git config user.email "gideon211@users.noreply.github.com"
            echo "--- status ---"
            git status --short
            git add -A -- . ':(exclude).ci-results'
            echo "--- commit ---"
            git commit -m "fix: AI-generated patch for CI failure"$'\n\n'"Automated fix by ai-debug workflow."$'\n'"Attempts: $ATTEMPTS / $MAX_ATTEMPTS"
            echo "commit exit code: $?"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git"

            # Final diff-guard gate (belt & suspenders) before push
            echo "--- final ai-diff-guard gate ---"
            if ! node scripts/ai-diff-guard.js origin/main 2>&1; then
              echo "Final diff guard failed — aborting PR creation."
              exit 0
            fi

            echo "--- push ---"
            git push origin "$DEBUG_BRANCH" 2>&1
            echo "push exit code: $?"

            TITLE=$(printf 'fix: AI patch for CI failure' )
            [ -n "$ANALYSIS" ] && TITLE=$(echo "$ANALYSIS" | head -1 | cut -c1-90)

            # Build PR body with jq (avoids shell-escaping breakage)
            jq -n \
              --arg title "$TITLE" \
              --arg head "$DEBUG_BRANCH" \
              --arg base "${{ github.event.workflow_run.head_branch }}" \
              --arg analysis "$ANALYSIS" \
              --arg jobs "$FAIL_JOBS_RAW" \
              --arg run "$RUN_URL" \
              --arg sha "$BASE_SHA" \
              --arg attempts "$ATTEMPTS / $MAX_ATTEMPTS" \
              --arg sig "$SIG" \
              '{title:$title, head:$head, base:$base, draft:true,
                body: ("**AI-generated fix** — attempts " + $attempts + ". Review before merging.\n\n"
                 + "## AI analysis\n" + (if ($analysis=="" or $analysis=="null") then "_No analysis captured._" else $analysis end) + "\n\n"
                 + "## Failed CI\n- Jobs: " + $jobs + "\n- Run: " + $run + "\n- Base commit: " + $sha + "\n\n"
                 + "<!-- ai-sig:" + $sig + " -->")}' \
              > .ci-results/pr-body.json

            echo "--- REST create PR ---"
            PR_RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pulls" \
              --data-binary @.ci-results/pr-body.json)
            echo "$PR_RESP"
            PR_NUM=$(echo "$PR_RESP" | jq -r '.number // empty' 2>/dev/null)
            if [ -z "$PR_NUM" ]; then
              echo "ERROR: PR creation failed"
              echo "$PR_RESP" > .ci-results/pr-create-error.json
              exit 1
            fi
            echo "PR #$PR_NUM created: https://github.com/$REPO/pull/$PR_NUM"

            # Post the analysis as a PR comment so it's visible in review.
            COMMENT=$(printf '**AI analysis:**\n\n%s\n\n---\nFailed jobs: %s  \nCI run: %s  \nBase commit: %s  \nAttempts: %s' \
              "$ANALYSIS" "$FAIL_JOBS_RAW" "$RUN_URL" "$BASE_SHA" "$ATTEMPTS / $MAX_ATTEMPTS")
            printf '%s' "$COMMENT" | jq -Rs '{body:.}' > .ci-results/pr-comment.json
            gh api "repos/$REPO/issues/$PR_NUM/comments" \
              --input .ci-results/pr-comment.json >/dev/null 2>&1 && \
              echo "Analysis comment posted to PR #$PR_NUM"
          } 2>&1 | tee -a $GITHUB_STEP_SUMMARY "$OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on fix branch
        if: steps.debug.outputs.fixed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          echo "Dispatching CI on $DEBUG_BRANCH so reviewers get real check results..."
          gh workflow run ci.yml --repo Expedition-Go-Tours/Expedition-Go-Backend-v2 --ref "$DEBUG_BRANCH" 2>&1 \
            && echo "CI dispatched for $DEBUG_BRANCH" \
            || echo "CI dispatch failed (workflow_dispatch may be missing). Local npm test + lint gate already passed."

      - name: Cleanup stale AI artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="Expedition-Go-Tours/Expedition-Go-Backend-v2"
          echo "Closing stale issues labeled ci-failure..."
          gh issue list --repo "$REPO" --label "ci-failure" --state open --limit 100 \
            --json number --jq '.[].number' 2>/dev/null | while read -r N; do
            if [ -n "$N" ]; then
              gh issue close "$N" --repo "$REPO" --reason completed \
                --comment "Auto-closed by AI Debug cleanup" 2>/dev/null && echo "closed issue #$N"
            fi
          done
          echo "Deleting stale ai-fix branches without an open PR..."
          gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[].name' 2>/dev/null \
            | grep '^ai-fix/' | while read -r BR; do
              PR=$(gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq '.[0].number // empty' 2>/dev/null)
              if [ -z "$PR" ]; then
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BR" 2>/dev/null && echo "deleted branch $BR"
              fi
            done
          echo "Cleanup done."

      - name: Report PR step output
        if: steps.debug.outputs.fixed == 'true'
        run: |
          set +e
          DEBUG_BRANCH="${{ steps.debug.outputs.debug_branch }}"
          PR_NUM=$(gh pr list --head "$DEBUG_BRANCH" --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$PR_NUM" ] && [ -f .ci-results/pr-output.log ]; then
            LOG=$(cat .ci-results/pr-output.log | tail -c 6000)
            BODY=$(printf '## PR step log - %s\n\n```\n%s\n```\n' "$DEBUG_BRANCH" "$LOG")
            gh issue create \
              --title "AI Debug: fix applied, PR step output [$DEBUG_BRANCH]" \
              --body "$BODY" \
              --label "ci-failure" 2>/dev/null || \
            gh issue create \
              --title "AI Debug: fix applied, PR step output [$DEBUG_BRANCH]" \
              --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: steps.debug.outputs.fixed != 'true' && steps.debug.outputs.skip_reason != 'infra_flake'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ci-failure" --description "CI is broken" --color "d73a4a" 2>/dev/null || true
          gh label create "needs-attention" --description "Requires investigation" --color "e99695" 2>/dev/null || true

          # Build the body with jq. AI text (analysis + debug log) is read via
          # --rawfile from files, NEVER interpolated into the shell, so it can
          # never break the script or corrupt the body.
          cp .ci-results/last-analysis.txt /tmp/ai-analysis.txt 2>/dev/null || printf '' > /tmp/ai-analysis.txt
          cp .ci-results/debug-log.txt /tmp/ai-debug-log.txt 2>/dev/null || printf '' > /tmp/ai-debug-log.txt
          jq -r \
            --arg branch "${{ github.event.workflow_run.head_branch }}" \
            --arg runid "${{ github.event.workflow_run.id }}" \
            --arg runurl "${{ github.event.workflow_run.html_url }}" \
            --arg attempts "${{ steps.debug.outputs.attempts }}" \
            --arg confidence "${{ steps.debug.outputs.last_confidence }}" \
            --rawfile analysis /tmp/ai-analysis.txt \
            --rawfile log /tmp/ai-debug-log.txt \
            '(
              "## CI Failure\n\n"
              + "**Branch:** `" + $branch + "`\n"
              + "**Run:** [" + $runid + "](" + $runurl + ")\n"
              + "**Attempts:** " + $attempts + "\n"
              + "**AI Analysis:** " + (if ($analysis=="" or $analysis=="null") then "_none captured_" else $analysis end) + "\n"
              + "**AI Confidence:** " + $confidence + "\n\n"
              + "AI debug agent could not resolve this. Manual fix needed.\n\n"
              + "1. Check the [failed CI logs](" + $runurl + ")\n"
              + "2. Fix manually\n"
              + "3. Push to trigger CI again\n\n"
              + "### AI Debug Log\n```\n" + $log + "\n```\n\n"
              + "Generated by ai-debug.yml"
            )' > /tmp/issue-body.md

          gh issue create -t "CI failure - AI debug unsuccessful" -F /tmp/issue-body.md -l "ci-failure,needs-attention" 2>/dev/null \
            || gh issue create -t "CI failure - AI debug unsuccessful" -F /tmp/issue-body.md

      - name: Save debug artifacts
        if: always()
        run: |
          mkdir -p /tmp/ai-debug-artifacts
          cp -r .ci-results/* /tmp/ai-debug-artifacts/ 2>/dev/null || true
          echo "Artifacts saved: $(ls /tmp/ai-debug-artifacts/ 2>/dev/null | tr '\n' ', ')"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-artifacts
          path: /tmp/ai-debug-artifacts/
          retention-days: 5

      - name: Cleanup
        if: always()
        run: |
          git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
          git branch -D "${{ steps.debug.outputs.debug_branch }}" 2>/dev/null || true
          rm -rf .ci-results /tmp/ai-debug-artifacts
