services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: travio-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: travio-dev-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: travio-app-dev
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/travio
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/travio
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
