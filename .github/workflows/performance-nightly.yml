name: Nightly Performance Tests

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

jobs:
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-master
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      DIRECT_URL: postgresql://test:test@localhost:5432/testdb
      RATELIMIT_GLOBAL_MAX: '100000'
      RATELIMIT_CHECKOUT_CALCULATE_MAX: '100000'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Run performance/load tests
        id: tests
        run: npm run test:load

      - name: Notify performance results
        if: always()
        run: |
          DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_DEPLOY_WEBHOOK }}"
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0

          PASSED="${{ steps.tests.outcome == 'success' }}"
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "n/a")
          SUBJECT=$(git log -1 --pretty='%s' 2>/dev/null || echo "n/a")
          AUTHOR=$(git log -1 --pretty='%an' 2>/dev/null || echo "n/a")

          if [ "$PASSED" = "true" ]; then
            TITLE="Nightly Performance Tests Passed"
            COLOR=5025616
          else
            TITLE="Nightly Performance Tests Failed"
            COLOR=15548997
          fi

          cat > /tmp/discord-payload.json << JSONEOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "color": ${COLOR},
              "fields": [
                { "name": "Tests", "value": "Nightly load tests (Jest)", "inline": true },
                { "name": "Commit", "value": "\`${SHORT_SHA}\` ${SUBJECT}", "inline": false },
                { "name": "Author", "value": "${AUTHOR}", "inline": true },
                { "name": "Run", "value": "[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true }
              ],
              "timestamp": "${{ github.event.head_commit.timestamp || '' }}"
            }]
          }
          JSONEOF
          bash scripts/discordSendEmbed.sh "$DISCORD_WEBHOOK_URL" /tmp/discord-payload.json
