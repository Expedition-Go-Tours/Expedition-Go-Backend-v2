# Validate the deployment artifacts that never run in the main test suite.
#
# The application tests prove behaviour. They say nothing about whether the
# Compose file still interpolates, whether the Nginx fragment is still valid, or
# whether a deploy script has a syntax error. Those failures only surface during
# a cutover, which is the worst possible time to discover them.
#
# This workflow is intentionally small and path-filtered: it runs when something
# that affects deployment changes, not on every application commit.

name: Deploy artifacts

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-release.yml'
      - '.github/workflows/deploy-validation.yml'
      - 'ci/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-release.yml'
      - '.github/workflows/deploy-validation.yml'
      - 'ci/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Compose, Nginx and deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax and shellcheck
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/scripts/*.sh; do
            bash -n "$script"
          done
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -x deploy/scripts/*.sh

      - name: Production Compose renders with immutable images
        shell: bash
        run: |
          set -euo pipefail
          env_dir="${RUNNER_TEMP}/travio-env"
          mkdir -p "$env_dir"
          # Empty env files are enough to validate interpolation and structure.
          # Real values belong on the host, never in the repository.
          : > "$env_dir/platform-api.env"
          : > "$env_dir/stays-api.env"
          PLATFORM_IMAGE="ghcr.io/expedition-go-tours/platform-api:sha-validate" \
          STAYS_IMAGE="ghcr.io/expedition-go-tours/stays-api:sha-validate" \
          PLATFORM_ENV_FILE="$env_dir/platform-api.env" \
          STAYS_ENV_FILE="$env_dir/stays-api.env" \
            docker compose -f deploy/compose.production.yml config > /dev/null
          # A missing image variable must fail to render. Compose's `:?` guard
          # is what stops an accidental tagless or blank deployment.
          if STAYS_IMAGE="ghcr.io/expedition-go-tours/stays-api:sha-validate" \
             PLATFORM_ENV_FILE="$env_dir/platform-api.env" \
             STAYS_ENV_FILE="$env_dir/stays-api.env" \
               docker compose -f deploy/compose.production.yml config > /dev/null 2>&1; then
            echo "::error::compose rendered without PLATFORM_IMAGE"
            exit 1
          fi

      - name: Local Compose renders
        shell: bash
        run: |
          set -euo pipefail
          # The local file intentionally reads the developer's `.env`, which is
          # gitignored and therefore absent on a clean runner. Create an empty
          # one for validation only, and leave a real one untouched.
          had_env=0
          if [ -f .env ]; then had_env=1; else : > .env; fi
          docker compose -f deploy/compose.local.yml config > /dev/null
          [ "$had_env" -eq 1 ] || rm -f .env

      - name: Nginx fragment is syntactically valid
        shell: bash
        run: |
          set -euo pipefail
          conf="${RUNNER_TEMP}/default.conf"
          cat > "$conf" <<'NGINX'
          server {
              listen 80;
              server_name _;
              include /etc/nginx/snippets/api-routing.conf;
          }
          NGINX
          docker run --rm \
            -v "${PWD}/deploy/nginx/api-routing.conf:/etc/nginx/snippets/api-routing.conf:ro" \
            -v "${conf}:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Readiness gate requires the right container and a healthy one
        shell: bash
        run: |
          set -euo pipefail
          healthy=travio-health-positive
          unhealthy=travio-health-negative
          docker run -d --name "$healthy" \
            --health-cmd "exit 0" --health-interval 1s --health-timeout 1s --health-retries 1 \
            alpine sleep 30 > /dev/null
          docker run -d --name "$unhealthy" \
            --health-cmd "exit 1" --health-interval 1s --health-timeout 1s --health-retries 1 \
            alpine sleep 30 > /dev/null
          trap 'docker rm -f "$healthy" "$unhealthy" > /dev/null 2>&1 || true' EXIT
          sleep 3
          if ! ( . deploy/scripts/lib.sh; wait_container_healthy "$healthy" alpine 5 1 ); then
            echo "::error::readiness gate rejected a healthy container"
            exit 1
          fi
          if ( . deploy/scripts/lib.sh; wait_container_healthy "$unhealthy" alpine 1 0 ); then
            echo "::error::readiness gate accepted an unhealthy container"
            exit 1
          fi
          if ( . deploy/scripts/lib.sh; wait_container_healthy "$healthy" not-the-image 1 0 ); then
            echo "::error::readiness gate accepted the wrong image"
            exit 1
          fi

      - name: Deploy scripts reject the wrong image
        shell: bash
        run: |
          set -euo pipefail
          # Source the library only; this must not reach the network or Docker.
          # `die` exits, so run each negative case in a subshell.
          if ( . deploy/scripts/lib.sh
               validate_image_ref "ghcr.io/expedition-go-tours/stays-api:latest" \
                 "ghcr.io/expedition-go-tours/stays-api" ); then
            echo "::error::validate_image_ref accepted :latest"
            exit 1
          fi
          if ( . deploy/scripts/lib.sh
               validate_image_ref "ghcr.io/someone/stays-api:sha-abc1234" \
                 "ghcr.io/expedition-go-tours/stays-api" ); then
            echo "::error::validate_image_ref accepted a foreign repository"
            exit 1
          fi
          ( . deploy/scripts/lib.sh
            validate_image_ref "ghcr.io/expedition-go-tours/stays-api:sha-abc1234" \
              "ghcr.io/expedition-go-tours/stays-api" )
