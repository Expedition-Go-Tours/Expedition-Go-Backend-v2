name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
  JWT_SECRET: ci-test-jwt-secret
  JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
  JWT_EXPIRES_IN: 90d
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  CLOUDINARY_CLOUD_NAME: dummy
  CLOUDINARY_API_KEY: '000000000000000'
  CLOUDINARY_API_SECRET: dummy-secret
  SENDGRID_API_KEY: SG.dummy
  FIREBASE_PROJECT_ID: dummy-project
  FIREBASE_CLIENT_EMAIL: dummy@dummy.com
  FIREBASE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    dummy-key
    -----END PRIVATE KEY-----
  SENTRY_DSN: ''
  MIMO_API_KEY: ''
  ALLOWED_ORIGINS: http://localhost:3000

jobs:
  # ── Lint (every push) ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Unit tests (every push) ────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    env:
      JEST_JUNIT_OUTPUT_DIR: reports/junit
      JEST_JUNIT_OUTPUT_NAME: unit.xml
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest __tests__/unit/ --no-coverage --forceExit --reporters=default --reporters=jest-junit

      - name: Export test counts
        id: counts
        if: success() || failure()
        continue-on-error: true
        run: node scripts/extractJunitCounts.js reports/junit/unit.xml

      - name: Publish unit test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Unit Tests
          path: reports/junit/unit.xml
          reporter: java-junit

  # ── Integration tests (every push) ─────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      JEST_JUNIT_OUTPUT_DIR: reports/junit
      JEST_JUNIT_OUTPUT_NAME: api.xml
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - run: npx jest __tests__/api/ --no-coverage --forceExit --reporters=default --reporters=jest-junit

      - name: Export test counts
        id: counts
        if: success() || failure()
        continue-on-error: true
        run: node scripts/extractJunitCounts.js reports/junit/api.xml

      - name: Publish integration test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Integration Tests
          path: reports/junit/api.xml
          reporter: java-junit

  # ── App startup verification (PR + main only) ──────────────────────
  startup-check:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: production
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed permissions and roles
        run: node prisma/seed.js

      - name: Seed performance test data
        run: node prisma/seedPerf.js

      - name: Start application in background
        run: |
          node server.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Server is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Verify health response
        run: |
          RESPONSE=$(curl -s http://localhost:5000/health)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);process.exit(j.status==='success'?0:1)})")
          echo "Health check passed"

      - name: Smoke test — expedition tours
        run: |
          TOURS=$(curl -s http://localhost:5000/api/expedition/tours)
          echo "$TOURS" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);process.exit(j.status==='success'&&j.data.tours.length>0?0:1)})"
          echo "Expedition tours endpoint OK"

      - name: Smoke test — tour detail by slug
        run: |
          DETAIL=$(curl -s http://localhost:5000/api/expedition/tours/perf-safari-adventure)
          echo "$DETAIL" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);process.exit(j.status==='success'&&j.data.tour.tour.slug==='perf-safari-adventure'?0:1)})"
          echo "Tour detail endpoint OK"

      - name: Smoke test — checkout calculation
        run: |
          CALC=$(curl -s -X POST http://localhost:5000/api/expedition/checkout/calculate \
            -H 'Content-Type: application/json' \
            -d '{"tourId":"9b55dcd5-5b1d-4a3e-ac87-3d3c443e9d93","selectedDate":"2026-08-15","travelers":{"adults":2}}')
          echo "$CALC" | node -e "process.stdin.on('data',d=>{const j=JSON.parse(d);process.exit(j.status==='success'&&j.data.pricing.total>0?0:1)})"
          echo "Checkout calculation OK"

      - name: Kill application
        if: always()
        run: kill ${{ env.APP_PID }} || true

  # ── OWASP ZAP security scan (PR + main only) ──────────────────────
  zap-scan:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: production
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed permissions and roles
        run: node prisma/seed.js

      - name: Seed performance test data
        run: node prisma/seedPerf.js

      - name: Start application in background
        run: |
          node server.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Server is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Create ZAP output directory
        run: mkdir -p zap-output && chmod 777 zap-output

      - name: Run OWASP ZAP API scan
        continue-on-error: true
        run: |
          docker run -v ${{ github.workspace }}/zap-output:/zap/wrk --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:5000/swagger.json \
            -f openapi -r zap-report.html -J zap-report.json

      - name: Debug ZAP output
        if: always()
        run: ls -la zap-output/

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-output/

      - name: Kill application
        if: always()
        run: kill ${{ env.APP_PID }} || true

  # ── PR smoke test via k6 (PR + main only) ───────────────────────────
  smoke-test:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?connection_limit=50
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test?connection_limit=50
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed permissions and roles
        run: node prisma/seed.js

      - name: Seed performance test data
        run: node prisma/seedPerf.js

      - name: Create k6 output directory
        run: mkdir -p k6-output && touch k6-output/.gitkeep

      - name: Start application in background
        run: |
          node server.js &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Server is healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Warm up Redis cache
        run: |
          echo "Warming up tours listing..."
          curl -sf http://localhost:5000/api/expedition/tours > /dev/null
          echo "Warming up tour detail..."
          curl -sf http://localhost:5000/api/expedition/tours/perf-safari-adventure > /dev/null
          echo "Warm-up complete"

      - name: Install k6
        run: |
          curl -sL -o k6.tar.gz https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz
          tar xzf k6.tar.gz
          sudo cp k6-v2.1.0-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Run k6 smoke test
        run: |
          k6 run __tests__/performance/k6/scenarios/smoke.js \
            --summary-export k6-output/summary.json \
            --out json=k6-output/performance-report.json

      - name: Upload k6 artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-smoke
          path: k6-output/

      - name: Kill application
        if: always()
        run: kill ${{ env.APP_PID }} || true

  # ── E2E tests (PR + main only) ─────────────────────────────────────
  e2e-tests:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      JEST_JUNIT_OUTPUT_DIR: reports/junit
      JEST_JUNIT_OUTPUT_NAME: e2e.xml
    outputs:
      passed: ${{ steps.counts.outputs.passed }}
      failed: ${{ steps.counts.outputs.failed }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest __tests__/e2e/ --no-coverage --forceExit --reporters=default --reporters=jest-junit

      - name: Export test counts
        id: counts
        if: success() || failure()
        continue-on-error: true
        run: node scripts/extractJunitCounts.js reports/junit/e2e.xml

      - name: Publish e2e test results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: E2E Tests
          path: reports/junit/e2e.xml
          reporter: java-junit

  # ── Full coverage + badge (PR + main only) ─────────────────────────
  coverage:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-full
          path: coverage/

      - name: Generate coverage badge
        run: node scripts/generateBadge.js

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.svg

  # ── Deploy to Hetzner (main only) ────────────────────────────────
  deploy:
    if: github.ref_name == 'main'
    needs:
      - lint
      - unit-tests
      - integration-tests
      - startup-check
      - smoke-test
      - e2e-tests
      - coverage
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ github.sha }}
      shortSha: ${{ steps.commit.outputs.SHORT_SHA }}
      startTs: ${{ steps.start.outputs.ts }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Record deploy start time
        id: start
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Collect commit info
        id: commit
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty='%an')
          SUBJECT=$(git log -1 --pretty='%s')
          BODY=$(git log -1 --pretty='%b' | head -20)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "AUTHOR=$AUTHOR" >> $GITHUB_OUTPUT
          # Write multiline body safely
          {
            echo "SUBJECT<<COMMIT_EOF"
            echo "$SUBJECT"
            echo "COMMIT_EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "BODY<<BODY_EOF"
            echo "$BODY"
            echo "BODY_EOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Count changed files (best-effort)
        id: files
        continue-on-error: true
        run: |
          COUNT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.files||[]).length)}catch{console.log('')}})")
          if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deploy started
        if: success()
        env:
          STATE: started
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SHORT_SHA: ${{ steps.commit.outputs.SHORT_SHA }}
          DEPLOY_AUTHOR: ${{ steps.commit.outputs.AUTHOR }}
          DEPLOY_SUBJECT: ${{ steps.commit.outputs.SUBJECT }}
          DEPLOY_BODY: ${{ steps.commit.outputs.BODY }}
          DEPLOY_CHANGED_FILES: ${{ steps.files.outputs.count }}
          DEPLOY_ENV: production
          DEPLOY_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node scripts/deployNotify.js

      - name: Deploy to Hetzner via SSH
        id: deploy_ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy/Expedition-Go-Backend-v2

            echo "=== Syncing to latest code (dirty-tree safe) ==="
            git fetch origin main
            # Preserve any local changes (manual edits, stray files) in a stash
            # so they can never block the production deploy, then guarantee the
            # working tree exactly matches origin/main.
            git stash push -u -m "ci-deploy-auto-stash $(date -u +%F_%T)" 2>/dev/null || true
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci --omit=dev

            echo "=== Generating Prisma client ==="
            npx prisma generate

            echo "=== Running migrations ==="
            npx prisma migrate deploy

            echo "=== Reloading API (graceful cluster reload, zero-downtime) ==="
            # One-time migration: if the API is still running as a single fork
            # instance (pre-cluster), swap it to the ecosystem definition
            # (cluster, 2 workers) first. Afterwards, pm2 reload rolls workers
            # one at a time so the API never drops.
            CUR_MODE=$(pm2 jlist 2>/dev/null | python3 -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                for p in d:
                    if p.get('name') == 'expedition-api':
                        print((p.get('pm2_env') or {}).get('exec_mode', 'fork'))
                        break
            except Exception:
                print('fork')
            " 2>/dev/null || echo fork)
            if [ "$CUR_MODE" != "cluster_mode" ]; then
              echo "API not in cluster mode yet — migrating via ecosystem config"
              pm2 delete expedition-api >/dev/null 2>&1 || true
              pm2 start ecosystem.config.js --only expedition-api
            else
              pm2 reload ecosystem.config.js --only expedition-api --update-env
            fi

            echo "=== Restarting support apps (reconnect-safe, no graceful needed) ==="
            pm2 restart discord-bot clip-service >/dev/null 2>&1 || true

            echo "=== Saving PM2 process list ==="
            pm2 save

            echo "=== Deploy complete ==="

      - name: Compute deploy duration
        id: dur
        if: always()
        run: echo "sec=$(( $(date +%s) - ${{ steps.start.outputs.ts }} ))" >> $GITHUB_OUTPUT

      - name: Notify deploy completed
        if: success()
        env:
          STATE: completed
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SHORT_SHA: ${{ steps.commit.outputs.SHORT_SHA }}
          DEPLOY_STAGE: Deployed
          DEPLOY_DURATION: ${{ steps.dur.outputs.sec }}
          TESTS_UNIT_PASSED: ${{ needs.unit-tests.outputs.passed }}
          TESTS_UNIT_FAILED: ${{ needs.unit-tests.outputs.failed }}
          TESTS_UNIT_SKIPPED: ${{ needs.unit-tests.outputs.skipped }}
          TESTS_INTEGRATION_PASSED: ${{ needs.integration-tests.outputs.passed }}
          TESTS_INTEGRATION_FAILED: ${{ needs.integration-tests.outputs.failed }}
          TESTS_INTEGRATION_SKIPPED: ${{ needs.integration-tests.outputs.skipped }}
          TESTS_E2E_PASSED: ${{ needs.e2e-tests.outputs.passed }}
          TESTS_E2E_FAILED: ${{ needs.e2e-tests.outputs.failed }}
          TESTS_E2E_SKIPPED: ${{ needs.e2e-tests.outputs.skipped }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node scripts/deployNotify.js

      - name: Notify deploy failed
        if: failure()
        env:
          STATE: failed
          FAIL_STAGE: deployment
          FAIL_STEP: SSH deployment
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SHORT_SHA: ${{ steps.commit.outputs.SHORT_SHA }}
          DEPLOY_DURATION: ${{ steps.dur.outputs.sec }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node scripts/deployNotify.js

  # ── Post-deploy verification (main only) ──────────────────────────
  deploy-verify:
    if: github.ref_name == 'main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Record verify start time
        id: verify_start
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Verify live health endpoint
        id: health
        continue-on-error: true
        run: |
          attempts=10
          delay=15
          for i in $(seq 1 "$attempts"); do
            RESP=$(curl -s -o /tmp/health.json -w "%{http_code} %{time_total}" https://apiv1.travioafrica.com/health)
            CODE=$(echo "$RESP" | awk '{print $1}')
            LATENCY=$(echo "$RESP" | awk '{print $2}')
            echo "attempt $i/$attempts: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "code=$CODE" >> $GITHUB_OUTPUT
              echo "latency=$LATENCY" >> $GITHUB_OUTPUT
              echo "details=$(cat /tmp/health.json)" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then sleep "$delay"; fi
          done
          echo "code=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Smoke test live tours endpoint
        id: tours
        continue-on-error: true
        run: |
          attempts=5
          delay=15
          for i in $(seq 1 "$attempts"); do
            HTTP_CODE=$(curl -s -o /tmp/tours.json -w "%{http_code}" https://apiv1.travioafrica.com/api/expedition/tours)
            echo "attempt $i/$attempts: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(node -pe "const j=JSON.parse(require('fs').readFileSync('/tmp/tours.json','utf8'));j.status||''" 2>/dev/null || echo "")
              if [ "$STATUS" = "success" ]; then
                echo "code=$HTTP_CODE" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            if [ "$i" -lt "$attempts" ]; then sleep "$delay"; fi
          done
          echo "code=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Compute verification durations
        id: dur
        if: always()
        run: |
          NOW=$(date +%s)
          VERIFY_START=${{ steps.verify_start.outputs.ts }}
          DEPLOY_START=${{ needs.deploy.outputs.startTs }}
          echo "verify=$(( NOW - VERIFY_START ))" >> $GITHUB_OUTPUT
          echo "total=$(( NOW - DEPLOY_START ))" >> $GITHUB_OUTPUT

      - name: Notify production verified
        if: steps.health.outcome == 'success' && steps.tours.outcome == 'success'
        env:
          STATE: verified
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOY_SHORT_SHA: ${{ needs.deploy.outputs.shortSha }}
          PRODUCTION_URL: https://apiv1.travioafrica.com
          HEALTH_CODE: ${{ steps.health.outputs.code }}
          HEALTH_LATENCY_MS: ${{ steps.health.outputs.latency }}
          HEALTH_DETAILS: ${{ steps.health.outputs.details }}
          TOURS_CODE: ${{ steps.tours.outputs.code }}
          VERIFY_DURATION: ${{ steps.dur.outputs.verify }}
          TOTAL_DURATION: ${{ steps.dur.outputs.total }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node scripts/deployNotify.js

      - name: Notify verification failed
        if: failure()
        env:
          STATE: failed
          FAIL_STAGE: verification
          FAIL_STEP: Production verification
          DEPLOY_SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOY_SHORT_SHA: ${{ needs.deploy.outputs.shortSha }}
          DEPLOY_DURATION: ${{ steps.dur.outputs.total }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: node scripts/deployNotify.js

  # ── CI failure notification (runs after all test jobs) ──────────
  ci-notify:
    if: always()
    needs:
      - lint
      - unit-tests
      - integration-tests
      - startup-check
      - smoke-test
      - e2e-tests
      - coverage
      - deploy
      - deploy-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Record CI start time
        id: start
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Determine overall CI status
        id: status
        run: |
          FAILED=false
          for RESULT in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.startup-check.result }}" \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.e2e-tests.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.deploy.result }}" \
            "${{ needs.deploy-verify.result }}"; do
            if [ "$RESULT" = "failure" ]; then
              FAILED=true
              break
            fi
          done
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Compute CI duration
        id: dur
        if: always()
        run: echo "sec=$(( $(date +%s) - ${{ steps.start.outputs.ts }} ))" >> $GITHUB_OUTPUT

      - name: Notify CI failed
        if: steps.status.outputs.failed == 'true'
        env:
          STATE: ci_failed
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SHORT_SHA: ${{ github.sha }}
          CI_DURATION: ${{ steps.dur.outputs.sec }}
          TESTS_UNIT_PASSED: ${{ needs.unit-tests.outputs.passed }}
          TESTS_UNIT_FAILED: ${{ needs.unit-tests.outputs.failed }}
          TESTS_UNIT_SKIPPED: ${{ needs.unit-tests.outputs.skipped }}
          TESTS_INTEGRATION_PASSED: ${{ needs.integration-tests.outputs.passed }}
          TESTS_INTEGRATION_FAILED: ${{ needs.integration-tests.outputs.failed }}
          TESTS_INTEGRATION_SKIPPED: ${{ needs.integration-tests.outputs.skipped }}
          TESTS_E2E_PASSED: ${{ needs.e2e-tests.outputs.passed }}
          TESTS_E2E_FAILED: ${{ needs.e2e-tests.outputs.failed }}
          TESTS_E2E_SKIPPED: ${{ needs.e2e-tests.outputs.skipped }}
          FAILED_JOBS: ${{ steps.status.outputs.failed_jobs }}
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          # Collect failed job names
          NEEDS_CONTEXT='${{ needs }}'
          FAILED_JOBS=""
          for JOB in lint unit-tests integration-tests startup-check smoke-test e2e-tests coverage deploy deploy-verify; do
            RESULT=$(echo "$NEEDS_CONTEXT" | jq -r --arg j "$JOB" '.[$j].result // "skipped"')
            if [ "$RESULT" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS}\`${JOB}\` "
            fi
          done
          echo "failed_jobs=$FAILED_JOBS" >> "$GITHUB_OUTPUT"
          node scripts/deployNotify.js
