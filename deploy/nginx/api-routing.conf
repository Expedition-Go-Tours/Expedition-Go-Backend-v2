# Nginx server-block snippet — route Stays to 5100, everything else to 5000.
#
# This file is a FRAGMENT. It is included inside each `server { ... }` block
# (apiv1.travioafrica.com, api.travioghana.com, api.expeditiongotours.com).
# See deploy/nginx/README.md for installation and verification steps.
#
# Ordering rules that matter:
#
#   * Plain-prefix locations are matched by longest prefix, so the two Stays
#     locations below win over `location /` regardless of order.
#   * `^~` stops Nginx from evaluating regex locations for these paths. If a
#     site later adds a regex location (e.g. `\.php$`), Stays routing must not
#     silently fall through to the Platform API.
#   * Both the collection path and its children are listed: a client hitting
#     `/api/travioghana/supplier/stays` (no trailing slash) must reach Stays too,
#     and must not match a `/…stays-something` neighbour.
#   * The bare and versioned paths are both listed because Stays is served under
#     both during the alias period.

# ── Stays API (canonical) ────────────────────────────────────────────────────
location = /api/v1/travioghana/supplier/stays {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 50M;
}
location ^~ /api/v1/travioghana/supplier/stays/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 50M;
}

# ── Stays API (legacy alias) ─────────────────────────────────────────────────
location = /api/travioghana/supplier/stays {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 50M;
}
location ^~ /api/travioghana/supplier/stays/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 50M;
}

# ── Platform API (everything else) ───────────────────────────────────────────
# Unchanged behaviour: websocket upgrade headers are preserved for Socket.IO,
# 50 MB uploads and the 300 s read timeout stay as they are today.
location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_max_body_size 50M;
}
