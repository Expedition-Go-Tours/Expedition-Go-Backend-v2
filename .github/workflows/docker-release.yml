# Build and publish the two API images, then deploy them behind an explicit gate.
#
# A main-branch deploy is triggered by the CI workflow finishing successfully
# (`workflow_run`), so a red test suite can never ship. Tag pushes and manual
# dispatches still publish images; the deploy jobs remain behind
# DOCKER_DEPLOY_ENABLED.
#
# Images never use the `latest` tag. Every build gets the immutable commit-SHA
# tags; a `vX.Y.Z` tag additionally gets semver tags. The deploy scripts refuse
# anything else.

name: Docker Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Read the CI artifact and the run's job timings for the release summary.
  actions: read
  pull-requests: read

concurrency:
  # One image build per commit. Do not cancel a running publish — a half-pushed
  # manifest is worse than a queued one.
  group: docker-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: expedition-go-tours
  # App directory on the VPS, matching ecosystem.config.js.
  DEPLOY_PATH: /home/deploy/Expedition-Go-Backend-v2
  # The commit CI actually tested. On workflow_run, RELEASE_SHA is the branch
  # head at trigger time, which can be newer than the tested commit.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RELEASE_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  # ── Which images does this change need? ────────────────────────────────────
  changes:
    name: Detect affected applications
    # A workflow_run fires for failed CI too. Nothing downstream should start.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      stays: ${{ steps.filter.outputs.stays }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Download CI change set
        # CI knows the push range; this workflow only sees the tip commit.
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ci-tests

      - name: Evaluate ci/dependency-map.json
        id: filter
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -s /tmp/ci-tests/changed-files.txt ]; then
            # Authoritative: the exact file list CI tested.
            node ci/detect-changes.js --stdin < /tmp/ci-tests/changed-files.txt
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            base="$(git rev-parse "${RELEASE_SHA}^" 2>/dev/null || true)"
            if [ -n "$base" ]; then
              git diff --name-only "$base" "$RELEASE_SHA" | node ci/detect-changes.js --stdin
            else
              node ci/detect-changes.js --all
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual run: rebuild both on purpose.
            node ci/detect-changes.js --all
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base="${EVENT_BEFORE:-}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "${RELEASE_SHA}^" 2>/dev/null || true)"
            fi
            if [ -n "$base" ]; then
              git diff --name-only "$base" "$RELEASE_SHA" | node ci/detect-changes.js --stdin
            else
              # New branch with no parent: treat every tracked file as changed.
              git ls-files | node ci/detect-changes.js --stdin
            fi
          else
            node ci/detect-changes.js --all
          fi

  # ── Deploy start notification ──────────────────────────────────────────────
  announce:
    name: Announce deploy
    needs: [changes]
    if: ${{ !cancelled() && vars.DOCKER_DEPLOY_ENABLED == 'true' && (needs.changes.outputs.platform == 'true' || needs.changes.outputs.stays == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Post deploy start to Discord
        # A notification must never fail a release.
        continue-on-error: true
        env:
          MODE: start
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK || secrets.DISCORD_DEPLOY_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_REF: ${{ env.RELEASE_REF }}
          APPS: ${{ needs.changes.outputs.platform == 'true' && 'platform' || '' }}${{ needs.changes.outputs.platform == 'true' && needs.changes.outputs.stays == 'true' && ', ' || '' }}${{ needs.changes.outputs.stays == 'true' && 'stays' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: node scripts/release/notify.js

  # ── Build and push ─────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' || needs.changes.outputs.stays == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: platform
            image: platform-api
            target: platform-api
            changed: ${{ needs.changes.outputs.platform }}
          - app: stays
            image: stays-api
            target: stays-api
            changed: ${{ needs.changes.outputs.stays }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Skip unaffected application
        id: gate
        shell: bash
        run: |
          if [ "${NEEDS_OUTPUT}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change requires the ${{ matrix.app }} image; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NEEDS_OUTPUT: ${{ matrix.changed }}

      - name: Set up Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release commit
        id: sha
        shell: bash
        run: echo "short=${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}

      - name: Derive tags and labels
        id: meta
        if: steps.gate.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase path; the owner below is already lowercase.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          # `latest` is never produced, not even for a semver tag.
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=sha-${{ env.RELEASE_SHA }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_REF }}

      - name: Build and push
        id: push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ env.RELEASE_SHA }}
            RELEASE_VERSION=${{ env.RELEASE_REF }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true
          sbom: true

      - name: Record image digest
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Migrations (once, before any container is replaced) ────────────────────
  migrate:
    name: Apply migrations
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.migrations == 'true' && vars.DOCKER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository-wide serialisation for schema changes. A second release waits
    # instead of racing `prisma migrate deploy` against the first.
    concurrency:
      group: production-database
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key from a repository secret rather than trusting
          # whatever answers on port 22 the first time.
          # Prefer a pinned host key. When DEPLOY_HOST_KEY is not configured,
          # fall back to ssh-keyscan so the pipeline can still run; add the
          # secret to remove the trust-on-first-use window.
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::could not obtain the host key"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deployment checkout
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "bash -s -- '${DEPLOY_PATH}' '${RELEASE_SHA}'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          RELEASE_SHA="$2"
          # deploy-platform and deploy-stays run concurrently and both reset
          # this checkout. Concurrent `git fetch` updates the same remote ref and
          # fails with "incorrect old value provided"; serialize the whole
          # fetch+reset through one lock.
          mkdir -p /var/lib/travio
          LOCK="/var/lib/travio/checkout.lock"
          exec 9>"$LOCK"
          flock -w 120 9
          if [ "$(id -u)" -eq 0 ] && id deploy >/dev/null 2>&1; then
            su - deploy -c "cd '$DEPLOY_PATH' && git fetch --quiet origin && git reset --hard '$RELEASE_SHA'"
          else
            cd "$DEPLOY_PATH" && git fetch --quiet origin && git reset --hard "$RELEASE_SHA"
          fi
          flock -u 9
          REMOTE

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve platform image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="${REGISTRY}/${IMAGE_OWNER}/platform-api:sha-${RELEASE_SHA:0:7}"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "::error::could not resolve a digest for $tag"; exit 1; }
          echo "ref=${tag%@*}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} -> ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deploy-migrations.sh on the host
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "cd '${DEPLOY_PATH}' && ./deploy/scripts/deploy-migrations.sh '${IMAGE}'"

  # ── Deploy Platform API ────────────────────────────────────────────────────
  deploy-platform:
    name: Deploy platform-api
    needs: [changes, build, migrate]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.migrate.result != 'failure' && vars.DOCKER_DEPLOY_ENABLED == 'true' && needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-platform-api
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key. When DEPLOY_HOST_KEY is not configured,
          # fall back to ssh-keyscan so the pipeline can still run; add the
          # secret to remove the trust-on-first-use window.
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::could not obtain the host key"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deployment checkout
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "bash -s -- '${DEPLOY_PATH}' '${RELEASE_SHA}'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          RELEASE_SHA="$2"
          # deploy-platform and deploy-stays run concurrently and both reset
          # this checkout. Concurrent `git fetch` updates the same remote ref and
          # fails with "incorrect old value provided"; serialize the whole
          # fetch+reset through one lock.
          mkdir -p /var/lib/travio
          LOCK="/var/lib/travio/checkout.lock"
          exec 9>"$LOCK"
          flock -w 120 9
          if [ "$(id -u)" -eq 0 ] && id deploy >/dev/null 2>&1; then
            su - deploy -c "cd '$DEPLOY_PATH' && git fetch --quiet origin && git reset --hard '$RELEASE_SHA'"
          else
            cd "$DEPLOY_PATH" && git fetch --quiet origin && git reset --hard "$RELEASE_SHA"
          fi
          flock -u 9
          REMOTE

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve platform image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="${REGISTRY}/${IMAGE_OWNER}/platform-api:sha-${RELEASE_SHA:0:7}"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "::error::could not resolve a digest for $tag"; exit 1; }
          echo "ref=${tag%@*}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} -> ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deploy-platform.sh on the host
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "cd '${DEPLOY_PATH}' && ./deploy/scripts/deploy-platform.sh '${IMAGE}'"

      - name: Verify platform-api from the host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "cd '${DEPLOY_PATH}' && ./deploy/scripts/verify-deployment.sh platform"

  # ── Deploy Stays API ───────────────────────────────────────────────────────
  deploy-stays:
    name: Deploy stays-api
    needs: [changes, build, migrate]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.migrate.result != 'failure' && vars.DOCKER_DEPLOY_ENABLED == 'true' && needs.changes.outputs.stays == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-stays-api
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key. When DEPLOY_HOST_KEY is not configured,
          # fall back to ssh-keyscan so the pipeline can still run; add the
          # secret to remove the trust-on-first-use window.
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::could not obtain the host key"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deployment checkout
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "bash -s -- '${DEPLOY_PATH}' '${RELEASE_SHA}'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          RELEASE_SHA="$2"
          # deploy-platform and deploy-stays run concurrently and both reset
          # this checkout. Concurrent `git fetch` updates the same remote ref and
          # fails with "incorrect old value provided"; serialize the whole
          # fetch+reset through one lock.
          mkdir -p /var/lib/travio
          LOCK="/var/lib/travio/checkout.lock"
          exec 9>"$LOCK"
          flock -w 120 9
          if [ "$(id -u)" -eq 0 ] && id deploy >/dev/null 2>&1; then
            su - deploy -c "cd '$DEPLOY_PATH' && git fetch --quiet origin && git reset --hard '$RELEASE_SHA'"
          else
            cd "$DEPLOY_PATH" && git fetch --quiet origin && git reset --hard "$RELEASE_SHA"
          fi
          flock -u 9
          REMOTE

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stays image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="${REGISTRY}/${IMAGE_OWNER}/stays-api:sha-${RELEASE_SHA:0:7}"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "::error::could not resolve a digest for $tag"; exit 1; }
          echo "ref=${tag%@*}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${tag} -> ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run deploy-stays.sh on the host
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "cd '${DEPLOY_PATH}' && ./deploy/scripts/deploy-stays.sh '${IMAGE}'"

      - name: Verify stays-api from the host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "cd '${DEPLOY_PATH}' && ./deploy/scripts/verify-deployment.sh stays"

  # ── Public ingress ─────────────────────────────────────────────────────────
  verify-public:
    name: Verify public ingress
    needs: [deploy-platform, deploy-stays]
    if: ${{ !cancelled() && needs.deploy-platform.result != 'failure' && needs.deploy-stays.result != 'failure' && (needs.deploy-platform.result == 'success' || needs.deploy-stays.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify every public vhost
        shell: bash
        run: ./deploy/scripts/verify-public-ingress.sh

  # ── Image cleanup ──────────────────────────────────────────────────────────
  # Runs only after public verification succeeds. The script removes only
  # superseded image IDs/tags, keeps current + previous rollback images, and
  # never touches Docker volumes or application data.
  prune-images:
    name: Prune superseded images
    needs: [verify-public]
    if: ${{ !cancelled() && needs.verify-public.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::could not obtain the host key"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Remove superseded Docker images
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            "root@${{ secrets.HETZNER_HOST }}" \
            "CONFIRM=1 bash -s" < deploy/scripts/prune-images.sh

  # ── Notification ───────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [changes, build, migrate, deploy-platform, deploy-stays, verify-public, prune-images]
    # Nothing built means nothing to announce: workflow-only pushes used to post
    # a red "image build did not succeed" for a run that never needed an image.
    if: ${{ always() && (needs.changes.outputs.platform == 'true' || needs.changes.outputs.stays == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Download CI test summary
        # Cross-run artifact: this workflow is triggered by CI, not part of it.
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: test-summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ci-tests

      - name: Post release summary to Discord
        # A notification must never fail a release.
        continue-on-error: true
        env:
          MODE: final
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK || secrets.DISCORD_DEPLOY_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_REF: ${{ env.RELEASE_REF }}
          APPS: ${{ needs.changes.outputs.platform == 'true' && 'platform' || '' }}${{ needs.changes.outputs.platform == 'true' && needs.changes.outputs.stays == 'true' && ', ' || '' }}${{ needs.changes.outputs.stays == 'true' && 'stays' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BUILD_RESULT: ${{ needs.build.result }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          PLATFORM_RESULT: ${{ needs.deploy-platform.result }}
          STAYS_RESULT: ${{ needs.deploy-stays.result }}
          VERIFY_RESULT: ${{ needs.verify-public.result }}
          TEST_SUMMARY_PATH: /tmp/ci-tests/test-summary.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          ONCALL_ROLE_ID: ${{ vars.DISCORD_ONCALL_ROLE_ID }}
        run: node scripts/release/notify.js
